<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בוחן תרגול — התנהגות צרכנים</title>
<style>
:root{
  --bg:#f7f6f3; --surface:#ffffff; --surface2:#f1efe8; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --borderS:#cfccc2; --accent:#0f766e; --accentSoft:#e2f2ef;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --warnTx:#854f0b; --warnBg:#faeeda;
  --clsTx:#1d4f91; --clsBg:#e4edf9;
  --sumTx:#6b3fa0; --sumBg:#f0e9f8;
  --hardTx:#9a3412; --hardBg:#fdebdf;
  --chipBg:#efeee9; --onAccent:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1a1a18; --surface:#242421; --surface2:#2f2f2c; --text:#ececea; --muted:#a3a39c;
    --border:#37372f; --borderS:#4a4a46; --accent:#5fd3c0; --accentSoft:#143d38;
    --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
    --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
    --warnTx:#fac775; --warnBg:#4a2b06;
    --clsTx:#9cc0f0; --clsBg:#1c3350;
    --sumTx:#c9b3ee; --sumBg:#2e2340;
    --hardTx:#f4a97f; --hardBg:#3f2317;
    --chipBg:#2f2f2a; --onAccent:#0b1f1c;
  }
}
html.dark{
  --bg:#1a1a18; --surface:#242421; --surface2:#2f2f2c; --text:#ececea; --muted:#a3a39c;
  --border:#37372f; --borderS:#4a4a46; --accent:#5fd3c0; --accentSoft:#143d38;
  --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
  --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
  --warnTx:#fac775; --warnBg:#4a2b06;
  --clsTx:#9cc0f0; --clsBg:#1c3350;
  --sumTx:#c9b3ee; --sumBg:#2e2340;
  --hardTx:#f4a97f; --hardBg:#3f2317;
  --chipBg:#2f2f2a; --onAccent:#0b1f1c;
}
html.light{
  --bg:#f7f6f3; --surface:#ffffff; --surface2:#f1efe8; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --borderS:#cfccc2; --accent:#0f766e; --accentSoft:#e2f2ef;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --warnTx:#854f0b; --warnBg:#faeeda;
  --clsTx:#1d4f91; --clsBg:#e4edf9;
  --sumTx:#6b3fa0; --sumBg:#f0e9f8;
  --hardTx:#9a3412; --hardBg:#fdebdf;
  --chipBg:#efeee9; --onAccent:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',Arial,'Helvetica Neue',sans-serif;line-height:1.65;
  overflow-wrap:break-word;-webkit-text-size-adjust:100%;}
.wrap{max-width:820px;margin:0 auto;padding:22px 20px 60px;}
header h1{font-size:23px;margin:0 0 4px;font-weight:650;}
header .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px;}
.aids{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.aid{display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  background:var(--chipBg);border:1px solid var(--border);border-radius:10px;
  padding:9px 14px;color:var(--text);font-size:13.5px;transition:.15s;flex:1 1 260px;}
.aid:hover{border-color:var(--accent);}
.aid b{font-weight:650;}
.aid i{font-style:normal;font-size:16px;line-height:1;flex:none;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.scopehint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px;padding-right:2px;}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px;}
.chip{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit;}
.chip:hover{border-color:var(--accent);}
.chip.active{background:var(--accent);color:var(--onAccent);border-color:var(--accent);}
.chip small{opacity:.75;font-size:11px;}
.lbl{font-size:12px;color:var(--muted);margin-left:4px;align-self:center;min-width:44px;}
.spacer{flex:1;}
.iconbtn{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
.iconbtn:hover{border-color:var(--accent);}
.note{background:var(--accentSoft);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;font-size:13px;margin-bottom:14px;}
.note b{color:var(--accent);}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;margin-bottom:12px;color:var(--muted);}
.stats b{color:var(--text);}
.bar{height:7px;background:var(--chipBg);border-radius:999px;overflow:hidden;margin-bottom:18px;}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);}
.qtext{font-size:17.5px;font-weight:600;margin-bottom:15px;line-height:1.6;}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--borderS);
  border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:.12s;
  background:var(--surface);width:100%;text-align:right;font:inherit;color:var(--text);}
.opt:hover{border-color:var(--accent);background:var(--accentSoft);}
.opt .ltr{font-weight:700;color:var(--accent);min-width:19px;}
.opt.correct{background:var(--okBg);border-color:var(--okBd);}
.opt.correct .ltr{color:var(--okTx);}
.opt.wrong{background:var(--errBg);border-color:var(--errBd);}
.opt.wrong .ltr{color:var(--errTx);}
.opt.locked{cursor:default;}
.opt.locked:hover{background:var(--surface);border-color:var(--borderS);}
.opt.correct.locked:hover{background:var(--okBg);border-color:var(--okBd);}
.opt.wrong.locked:hover{background:var(--errBg);border-color:var(--errBd);}
/* במצב מבחן אין משוב עד ההגשה — הבחירה מסומנת בצבע נייטרלי. ירוק אומר "נכון". */
.opt.picked{background:var(--accentSoft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.opt.picked .ltr{color:var(--accent);}
.opt.picked:hover{background:var(--accentSoft);border-color:var(--accent);}
.opt.picked .ltr::after{content:" ✓";font-size:12px;}
.expl{margin-top:8px;padding:13px 15px;border-radius:10px;background:var(--accentSoft);
  border:1px solid var(--border);font-size:14px;}
.expl .tag{font-weight:700;color:var(--accent);}
.nav{display:flex;gap:10px;margin-top:16px;}
.btn{flex:1;background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:12px;font-size:15px;cursor:pointer;font-family:inherit;}
.btn:hover{border-color:var(--accent);}
.btn-pri{background:var(--accent);color:var(--onAccent);border-color:var(--accent);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-height:190px;overflow-y:auto;}
.pbtn{width:33px;height:33px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font-size:12.5px;cursor:pointer;font-family:inherit;}
.pbtn.cur{outline:2px solid var(--accent);outline-offset:1px;}
.pbtn.ok{background:var(--okBg);border-color:var(--okBd);color:var(--okTx);}
.pbtn.bad{background:var(--errBg);border-color:var(--errBd);color:var(--errTx);}
.pbtn.ans{background:var(--accentSoft);border-color:var(--accent);color:var(--accent);}
.ptitle{font-size:12.5px;color:var(--muted);margin-bottom:7px;}
.result{text-align:center;}
.result .big{font-size:46px;font-weight:800;color:var(--accent);line-height:1.1;}
.result .grade{font-size:17px;margin:8px 0 16px;}
.clock{font-variant-numeric:tabular-nums;font-weight:650;}
.rev{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface2);font-size:14px;text-align:right;}
.rev .rq{font-weight:600;margin-bottom:6px;}
.rev .ra{color:var(--errTx);}
.rev .rc{color:var(--okTx);}
/* המילה שמכריעה בין התשובות, בהסברים של השאלות הקשות */
mark.key{background:var(--warnBg);color:inherit;padding:0 3px;border-radius:4px;font-weight:650;}
.ctitle{font-size:16px;font-weight:650;margin:0 0 6px;}
.brk{display:flex;align-items:center;gap:10px;font-size:13.5px;margin-bottom:7px;}
.brk .bl{flex:0 0 210px;}
.brk .bb{flex:1;height:8px;background:var(--chipBg);border-radius:999px;overflow:hidden;}
.brk .bb>i{display:block;height:100%;background:var(--okTx);}
.brk.mid .bb>i{background:var(--warnTx);}
.brk.low .bb>i{background:var(--errTx);}
.brk .bv{flex:0 0 44px;text-align:left;font-variant-numeric:tabular-nums;color:var(--muted);}
@media (max-width:540px){
  .wrap{padding:16px 14px 48px;} .card{padding:16px;} .qtext{font-size:16px;}
  header h1{font-size:19px;} .pbtn{width:29px;height:29px;font-size:11.5px;}
  .opt{padding:11px 12px;} .stats{gap:11px;font-size:13px;}
  .brk .bl{flex-basis:130px;font-size:12.5px;}
}

/* ---------- תצוגת הדפסה של השאלות ---------- */
#print{display:none;}
.pq{break-inside:avoid;margin-bottom:9px;}
.pq .pn{font-weight:700;color:var(--accent);}
.pq .po{margin:1px 0 0 0;padding-right:15px;}
.pq .pa{color:var(--okTx);font-weight:600;}
.pq .pe{color:var(--muted);}
.prhead{display:none;}
@media print{
  @page{size:A4;margin:11mm 10mm;}
  html,body{background:#fff!important;color:#000!important;}
  html{--accent:#0f5a54;--muted:#444;--okTx:#0a5c22;--border:#bbb;}
  .wrap{max-width:none;padding:0;}
  header,#app,.foot{display:none!important;}
  #print{display:block!important;font-size:9.6pt;line-height:1.34;}
  #print.cols{column-count:2;column-gap:8mm;column-rule:1px solid #ccc;}
  .prhead{display:block;border-bottom:1.5px solid #000;padding-bottom:2mm;
    margin-bottom:3mm;column-span:all;}
  .prhead h2{font-size:13pt;margin:0;}
  .prhead div{font-size:8.6pt;color:#444;margin-top:1mm;}
  .pq{margin-bottom:2.6mm;}
  .pq .pt{font-size:7.6pt;color:#666;}
  .pq .pe{font-size:8.8pt;}
}
</style>
</head>

  לתרגול לימודי בלבד · נבנה מסיכומי המצגות של הקורס ומדף התרגול של המרצה

<script>
var BANK=[
/* ===================== יחידה 1 — הצרכן החדש (רקע; לא ברשימת הנושאים לבחינה) ===================== */
{l:1,t:"הצרכן החדש (רקע)",s:"סיכום",q:"איזה מהבאים אינו אחת מחמש התמורות שבחלק «המוח הצרכני החדש», בסיכום הספר «הצרכן החדש»?",o:["כוחם של סמלים","העצמת הצרכן","מחשבה מהירה","טכנובציה","אופטימיות כלפי חדשנות"],c:3,e:"חמש התמורות: אופטימיות כלפי חדשנות, העצמת הצרכן, מחשבה מהירה, כוחם של סמלים ודרכים חדשות ליצור קשרים. טכנובציה היא אחד מארבעת כיווני הפעולה למשווקים, יחד עם «הדבר האמיתי», מעורבות ועוצמה."},
{l:1,t:"הצרכן החדש (רקע)",s:"סיכום",q:"במי בוטחים הצרכנים החדשים כמקור אמין למידע, ומה נובע מכך למשווקים, לפי הסיכום?",o:["באנשים שדומים להם. לכן צריך להציג «הוכחה חברתית»","במומחים ובמוסדות רשמיים בלבד. לכן צריך לפרסם בעיקר אישורים ותקנים","בפרסומות בטלוויזיה. לכן צריך להגדיל את תקציב הפרסום בערוצים המסורתיים","באנשי המכירות שבחנות. לכן צריך להשקיע בעיקר בהדרכה שלהם","במותגים ותיקים בלבד. לכן אין טעם להשיק מותג חדש בעידן הרשתות"],c:0,e:"לפי ברומטר האמון של אדלמן, צרכנים בוטחים באנשים שהם תופסים כדומים להם. בעידן הרשתות אלה גם קהילות, בלוגרים ומשפיענים. לכן המשווקים צריכים להציג «הוכחה חברתית»: המלצות, חוות דעת ודירוגים."},
{l:1,t:"הצרכן החדש (רקע)",s:"יישום",q:"דומינוס פיצה יצאה בקמפיין שנותן לגיטימציה לפספס, להירגע ולנוח. באיזה עיקרון השתמשה?",o:["מיקור המונים ברשת","JOMO: השמחה שבפספוס","הוכחה חברתית ברשתות","אומניצ'אנל","FOMO: החשש לפספס משהו חשוב"],c:1,e:"JOMO, Joy Of Missing Out, היא מגמת נגד לתופעת ה-FOMO. הצרכנים בעידן החדש לחוצים ודאוגים יותר, ולכן המשווקים צריכים למצוא דרכים להקל עליהם, להרגיע ולטעת ביטחון."},
{l:1,t:"הצרכן החדש (רקע)",s:"סיכום",q:"מה ההזדמנות השיווקית שנובעת מה«מחשבה המהירה» של הצרכנים החדשים, לפי הסיכום?",o:["לפנות רק לצרכנים מבוגרים, שיש להם יותר סבלנות למשימות מורכבות","להוסיף מידע רב ככל האפשר, כדי שהצרכן יוכל להשוות בין החלופות לעומק","להימנע משימוש בטכנולוגיה, כי היא מסיחה את דעתו של הצרכן","להאריך את תהליך הקנייה, כדי להעלות את המעורבות של הצרכן במוצר","לתת כלים ודרכים לקצר תהליכים, כמו הזמנה בלחיצה אחת או המלצות חכמות"],c:4,e:"השפע מקשה על קבלת החלטות ומוביל לקיצורי דרך. לכן מתן כלים ודרכים לקצר תהליכים הוא הזדמנות שיווקית: המלצות בנטפליקס, התחברות בלי סיסמה, רימרקטינג, כפתור «one click pizza» של דומינוס."},
{l:1,t:"הצרכן החדש (רקע)",s:"סיכום",q:"מה קרה, לפי המחקר שבסיכום, כשהוסיפו לעוגייה את המילה «אורגני»?",o:["לא נמצא שום הבדל באופן שבו הצרכנים העריכו את שתי העוגיות","הצרכנים אמרו שהיא טעימה יותר, אבל לא הסכימו לשלם עליה יותר","הם היו מוכנים לשלם יותר, אבל אמרו שהרגילה טעימה יותר","הצרכנים היו מוכנים לשלם עליה פחות, כי חשדו במילה שנוספה לאריזה","הצרכנים חשבו שיש בה יותר שומן וקלוריות, ולכן נמנעו מלקנות אותה"],c:2,e:"כוחם של סמלים: צרכנים היו מוכנים לשלם על העוגייה ה«אורגנית» 23% יותר, וחשבו שיש בה פחות שומן וקלוריות, אבל אמרו שהעוגייה ה«רגילה» טעימה יותר."},
{l:1,t:"הצרכן החדש (רקע)",s:"יישום",q:"לקוחה מצאה צפרדע חיה בחסה של חברת ירקות. החברה לא הכחישה, פרסמה את המקרה, והסבירה שהוא נובע מהמדיניות שלה לא להשתמש בחומרי הדברה. לאיזה כיוון פעולה שייכת התגובה?",o:["מעורבות: עידוד הצרכן להמליץ","עוצמה: מסר ייחודי, שמזעזע ומסעיר את הצרכן","«הדבר האמיתי»: אותנטיות ושקיפות","טכנובציה: הסתגלות לשינויים טכנולוגיים","העצמה: שיתוף הצרכן במהלך"],c:2,e:"«הדבר האמיתי»: מענה ישיר, מהיר, כנה ושקוף לפניות ולתלונות של צרכנים תורם לתחושת האותנטיות. זו דוגמת «כרמל יבולים» שבסיכום."},
{l:1,t:"הצרכן החדש (רקע)",s:"יישום",q:"יצרן גלידות פונה לקהל הרחב, ומבקש ממנו להציע ולבחור את הטעם הבא. איזו מארבע ההזדמנויות לערב את הצרכן מיושמת כאן?",o:["התאמה אישית","מיקור המונים","תחרותיות","העצמה","עידוד הצרכן להמליץ"],c:1,e:"ארבע ההזדמנויות לערב את הצרכן: עידוד להמליץ, התאמה אישית, תחרותיות ומיקור המונים. במיקור המונים פונים לקהל הרחב ונעזרים בחוכמת ההמונים, כמו במהלך של קראנץ' שבסיכום."},
{l:1,t:"הצרכן החדש (רקע)",s:"סיכום",q:"מהו אומניצ'אנל, לפי הסיכום?",o:["שילוב סינרגטי של החוויה הפיזית והחוויה הדיגיטלית","שירות לקוחות שפועל בכל שעות היממה","הפצה של אותו מוצר בכמה חנויות פיזיות של הרשת, באותה עיר","מעבר מלא של הלקוחות מהחנות הפיזית אל הקנייה המקוונת","פרסום של אותו מסר בדיוק בכל ערוצי המדיה"],c:0,e:"הקנייה המקוונת אינה מחליפה בהכרח את החוויה הפיזית. אומניצ'אנל הוא ערוץ שמשלב באופן סינרגטי בין החוויה הפיזית לחוויה הדיגיטלית: טכנולוגיה בתוך החנות הפיזית, וחוויה אישית יותר בקנייה המקוונת."},

{l:2,t:"צורך, רצון וביקוש",s:"מרצה",q:"חברת אפליקציות לניהול זמן מציגה בפרסום את הפער בין יום עבודה עמוס ומבולגן לבין יום מאורגן ורגוע. לאחר מכן היא מציעה את האפליקציה כדרך להגיע למצב הרצוי. איזו טענה מתארת בצורה המדויקת ביותר את המהלך?",o:["הפרסום יוצר אצל הצרכן צורך בסיסי חדש שלא היה קיים קודם.","האפליקציה עצמה היא הצורך, והסדר והרוגע הם הרצון.","הפרסום יכול להבליט את הפער בין המצב המצוי לרצוי ובכך לעורר הכרה בצורך; הבחירה באפליקציה היא דרך מסוימת לספק את הצורך.","הפרסום משפיע רק על הביקוש ואינו יכול להשפיע על הכרה בצורך או על רצונות.","הצורך נוצר רק לאחר שהצרכן מתנסה באפליקציה ומחליט אם היא טובה."],c:2,e:"לפי המפתח של המרצה. צורך הוא תפיסה של פער בין המצוי לרצוי. הפרסום אינו יוצר צורך בסיסי חדש: הוא מבליט את הפער, וכך מעורר הכרה בצורך. האפליקציה היא רצון, כלומר דרך פעולה מסוימת לספק את הצורך בסדר וברוגע."},
{l:2,t:"צורך, רצון וביקוש",s:"סיכום",q:"לפי הסיכום של יחידה 2, מהו צורך?",o:["מתח שנוצר אחרי הרכישה בין הציפייה לבין הביצוע","הערכה חיובית או שלילית של הצרכן כלפי מותג מסוים","רצון במוצר שמגובה ביכולת ובמסוגלות להשתמש בו","תפיסה של פער בין המצב המצוי למצב הרצוי","דרך פעולה מסוימת שהצרכן בוחר כדי להגיע לסיפוק"],c:3,e:"הצורך הוא פער, ומדויק יותר תפיסה של פער, בין המצב המצוי לרצוי. דרך פעולה מסוימת היא רצון, והערכה כלפי אובייקט היא עמדה."},
{l:2,t:"צורך, רצון וביקוש",s:"סיכום",q:"מתי, לפי הסיכום, הצרכן מכיר בצורך ומונע לספק אותו?",o:["כאשר כבר גיבש עמדה חיובית כלפי אחד המותגים","כאשר המוצר זמין בנקודת המכירה במחיר שנתפס כהוגן","כאשר גירוי חיצוני, כמו פרסומת, חושף אותו למוצר חדש","כאשר המצב המצוי והמצב הרצוי מתלכדים בתפיסה שלו","כאשר הפער הנתפס בין המצוי לרצוי רחב מספיק"],c:4,e:"כאשר הפער בין המצוי לרצוי רחב מספיק, הצרכן מכיר בצורך ומונע לספקו. גירוי חיצוני יכול להבליט את הפער, אבל ההכרה תלויה בגודל הפער הנתפס."},
{l:2,t:"צורך, רצון וביקוש",s:"סיכום",q:"איזה תיאור של תהליך ההנעה (מוטיבציה) תואם את הסיכום?",o:["סיפוק הצורך יוצר מתח חדש, והצרכן נמנע מפעילות עד שהמתח חולף מעצמו","גיבוש עמדה כלפי מותג יוצר רצון, והרצון הופך בהדרגה לצורך בסיסי","צורך שלא סופק יוצר מתח, והמתח דוחף לפעילות שתרגיע אותו","חשיפה חוזרת למסר מפחיתה מתח, ולכן הצרכן מפסיק לחפש דרך לספק את הצורך","הפעילות הצרכנית יוצרת מתח, והמתח הוא שמוביל בסוף להכרה בצורך"],c:2,e:"תהליך ההנעה: ההכרה בצורך הלא מסופק יוצרת מתח, והמתח דוחף את האדם לפעילות שמטרתה להרגיע אותו. הסדר הוא צורך, מתח, פעילות."},
{l:2,t:"צורך, רצון וביקוש",s:"יישום",q:"דנה נרשמת לסטודיו פילאטיס מסוים, כי היא רוצה להרגיש טוב יותר עם עצמה. איך מסווגים את שני המרכיבים לפי הסיכום?",o:["שניהם צרכים: האחד צורך פיזי, והאחר צורך רגשי","ההרשמה לסטודיו היא ביקוש, וההרגשה הטובה היא רצון","ההרגשה הטובה היא רצון, וההרשמה לסטודיו היא הצורך","ההרשמה לסטודיו המסוים היא רצון, וההרגשה הטובה היא הצורך","שניהם רצונות, כי הצורך נוצר רק אחרי ההתנסות בסטודיו"],c:3,e:"הצורך הוא יעד על עמוק ומופשט, כמו «הרגשה עצמית טובה». הרצון הוא דרך פעולה מסוימת שנבחרה כדי לספק אותו: להתעמל במקום מסוים. זו הדוגמה שבסיכום."},
{l:2,t:"צורך, רצון וביקוש",s:"יישום",q:"מותג טלפונים פונה לבני נוער, שהצורך הדומיננטי אצלם הוא חברתי. מה תפקיד המשווקת לפי הסיכום?",o:["להוריד מחיר, כי הביקוש בגיל הזה תלוי בעיקר ביכולת הכלכלית","להדגיש את המפרט הטכני, כי צרכים חברתיים אינם קשורים למוצר","ליצור אצל בני הנוער צורך חברתי חדש בעזרת פרסום אינטנסיבי","לפנות להורים בלבד, כי הם אלה שמכירים בצורך של ילדיהם","למצב את המכשיר כעונה על צרכים חברתיים, ולהדגיש זאת בפרסום"],c:4,e:"המשווקת אינה יוצרת את הצורך. היא מבינה מהו הצורך העיקרי של הצרכן, ומעוררת רצון למוצר בעזרת מיצוב שמתקשר לצורך הזה. כך הצרכן תופס את המוצר כמספק תועלות שעונות על צרכיו."},
{l:2,t:"צורך, רצון וביקוש",s:"סיכום",q:"מה היחס בין צורך לרצון לפי הסיכום?",o:["הצורך הוא יעד על עמוק ומופשט, והרצונות הם תרגומו ליעדים ספציפיים","צורך ורצון הם שני שמות לאותו פער בין המצב המצוי למצב הרצוי","הרצון הוא יעד על מופשט, והצרכים הם הדרכים הספציפיות להשיג אותו","הצורך נקבע על ידי המשווק, ואילו הרצון נקבע על ידי הצרכן עצמו","הרצון קודם לצורך, כי בלי מוצר מסוים הצרכן אינו מכיר בפער"],c:0,e:"הצורך הוא יעד על עמוק ומופשט. הצרכן מתרגם את יעדי העל ליעדים ספציפיים יותר ויותר, ואלה הם הרצונות: דרך פעולה מסוימת שנבחרה כדי לספק את הצורך."},
{l:2,t:"צורך, רצון וביקוש",s:"יישום",q:"רשת של ערכות בישול מציגה בפרסומת אישה שדומה לקהל היעד, מכינה ארוחה בעשר דקות בלי ניסיון קודם. על מה המסר הזה משפיע בעיקר, לפי הסיכום?",o:["על הצורך הבסיסי, כי הפרסומת יוצרת רעב שלא היה קיים","על הביקוש, דרך יצירת תחושת מסוגלות להשתמש במוצר","על הנאמנות, כי הצרכנית כבר רכשה את המוצר בעבר","על דרישות הסף, כי המוצר עומד בתקנים של מזון מוכן","על סף ההבחנה, כי הדמות דומה מאוד לצרכנית עצמה"],c:1,e:"לפי הסיכום, המשווק יכול להשפיע גם על ביקושים, על ידי יצירת מסוגלות לשימוש במוצר במסר: למשל פרזנטור שדומה לצרכן ומראה איך הוא משתמש במוצר."},

{l:2,t:"ערכים לצרכנים פרטיים (B2C)",s:"יישום",q:"יצרן משקאות מחזיר לשוק בקבוק זכוכית בעיצוב של שנות השמונים, ומפרסם אותו במסר של געגוע ושל כיף. לאיזו קבוצת ערכים בפירמידת BAIN הוא פונה בעיקר?",o:["תועלת לסביבה ולחברה","ערכים משני חיים","ערכים רגשיים","ערכים שימושיים","דרישות סף"],c:2,e:"עיצוב, נוסטלגיה וכיף הם הדוגמאות שבשקף לערכים רגשיים. בסיכום: הערכים הרגשיים, כמו אסתטיקה וכיף, מתקשרים בעיקר להנאה חושית."},
{l:2,t:"ערכים לצרכנים פרטיים (B2C)",s:"יישום",q:"אפליקציה לרשימות קניות מבטיחה: «חוסכת זמן, מפשטת את הקנייה ומפחיתה מאמץ». איזו קבוצת ערכים בפירמידת BAIN מודגשת כאן?",o:["ערכים רגשיים","ערכים שימושיים","תועלת לסביבה ולחברה","ערכים משני חיים","ערכים אישיים"],c:1,e:"חיסכון בזמן, פישוט וחיסכון במאמץ הם ערכים שימושיים (פונקציונליים), בבסיס הפירמידה. לצידם בסיכום: איכות, מגוון והפחתת סיכון."},
{l:2,t:"ערכים לצרכנים פרטיים (B2C)",s:"יישום",q:"תוכנית ליווי לריצה מפרסמת: «נעזור לך להאמין שאת מסוגלת, להגשים את עצמך ולהשתייך לקבוצה שרצה איתך». לאיזו קבוצה בפירמידת BAIN שייכים הערכים האלה?",o:["ערכים משני חיים","ערכים רגשיים","ערכים שימושיים","תועלת לסביבה ולחברה","ערכי השראה"],c:0,e:"מוטיבציה להצליח, מימוש עצמי, תקווה ושייכות הם ערכים משני חיים (Life changing), שמתקשרים לצרכים הגבוהים אצל מסלאו. «ערכי השראה» הם קבוצה בפירמידת הלקוחות העסקיים."},
{l:2,t:"ערכים לצרכנים פרטיים (B2C)",s:"יישום",q:"מותג נעליים מודיע שעל כל זוג שנמכר הוא מממן ניקוי של חוף ים. באיזו רמה של פירמידת BAIN לצרכנים פרטיים נמצא הערך הזה?",o:["מחוץ לפירמידה, כי אינו תועלת לצרכן עצמו","ברמה השלישית, עם הערכים משני החיים","בבסיס, עם הערכים השימושיים","בקודקוד: תועלת לסביבה ולחברה","ברמה השנייה, עם הערכים הרגשיים"],c:3,e:"בקודקוד הפירמידה נמצאת התועלת לסביבה (Social impact): למען הסביבה או הקהילה. גם היא ערך שהצרכן מקבל מהמוצר."},
{l:2,t:"ערכים לצרכנים פרטיים (B2C)",s:"סיכום",q:"מה קורה, לפי הסיכום, ככל שמותג מקושר ליותר צרכים, ובהם גם צרכים רגשיים וגבוהים?",o:["עולה בעיקר המודעות למותג, בלי קשר לשביעות הרצון","המיצוב מיטשטש, ולכן נתח השוק של המותג נוטה לרדת","הצרכנים מתקשים לזכור את המותג בגלל עומס אסוציאציות","גדלות שביעות הרצון של קהל המטרה, נתח השוק והצמיחה","המעורבות של הצרכנים יורדת, והקנייה הופכת להרגל"],c:3,e:"ככל שמותג מקושר ליותר צרכים, וגם לצרכים רגשיים וגבוהים, כך גדלות שביעות הרצון של קהל המטרה, נתח השוק והצמיחה של החברה והמותג. הדוגמה בסיכום: נספרסו אינה רק סטטוס, אלא גם קיימות, אסתטיקה ואיכות."},
{l:2,t:"ערכים לצרכנים פרטיים (B2C)",s:"סיכום",q:"מהו הערך המרכזי (Unique Value Point) לפי הסיכום?",o:["הערך שהכי זול לחברה לספק, ולכן כדאי לבנות עליו את המסר הפרסומי","סך כל הערכים שהמוצר מציע, כפי שהם מוצגים יחד בכל מרכיבי ההצעה השיווקית","הערך שמבדל מהמתחרים, רלוונטי לקהל המטרה, ואפשר לספקו לאורך זמן","הערך שרוב המתחרים כבר מציעים, ולכן הלקוחות מצפים לקבל אותו מכל ספק","הערך שנמצא בקודקוד הפירמידה, ולכן הוא חשוב מכל שאר הערכים שבה"],c:2,e:"הערך המרכזי מבדל את המוצר מהמתחרים, רלוונטי לקהל המטרה, והחברה יכולה לספקו לאורך זמן. הוא הערך שהכי יובלט, למשל במודעה שבה אי אפשר לספק את כל המידע."},
{l:2,t:"ערכים לצרכנים פרטיים (B2C)",s:"יישום",q:"לחברה מוצר שעונה על שבעה ערכים שונים. היא מתכננת שלט חוצות עם סיסמה אחת קצרה. מה נכון לעשות לפי הסיכום?",o:["לבחור לשלט את הערך השימושי ביותר, ולוותר על הערכים הרגשיים בכל הערוצים","להציג בשלט את כל שבעת הערכים, כי כל ערך מוסיף לשביעות הרצון של הקהל","להימנע מסיסמה, כי אי אפשר לתמצת במשפט מוצר שעונה על כמה ערכים שונים","להחליף בכל שבוע את הערך שמובלט בשלט, כדי שלא ייווצר מיצוב אחד קבוע","להבליט בשלט את הערך המרכזי, ולהציג את כלל הערכים בשאר ההצעה השיווקית"],c:4,e:"בקמפיין מדגישים תועלת אחת עיקרית, הערך המרכזי, בסיסמה קליטה. אבל בכלל ההצעה השיווקית המשווקת מדגישה את כלל הערכים שמשפיעים על קבלת ההחלטות ועל גיבוש העמדה הכוללת."},
{l:2,t:"ערכים לצרכנים פרטיים (B2C)",s:"סיכום",q:"מה נכון לגבי הקשר בין פירמידת הערכים של BAIN לבין מודל הצרכים של מסלאו, לפי הסיכום?",o:["BAIN דחתה את מסלאו, והחליפה צרכים בתכונות מוצר מדידות","BAIN הרחיבה את מסלאו, וקישרה ערכים לקבוצות של צרכים","הערכים הרגשיים אצל BAIN מקבילים לצורכי הביטחון אצל מסלאו","מסלאו עוסק בלקוחות עסקיים, ו-BAIN בצרכנים פרטיים בלבד","שתי הפירמידות זהות, פרט לשמות של חמש הרמות שבהן"],c:1,e:"BAIN הרחיבה את מודל הצרכים של מסלאו, ומצאה 30 ערכים שמתקשרים לארבע קבוצות צרכים. הערכים השימושיים מקבילים במידה מסוימת לצורכי הביטחון (לא השוואה חד ערכית), והערכים משני החיים מתקשרים לצרכים הגבוהים: שייכות ומימוש עצמי."},

{l:2,t:"לקוחות עסקיים וקנייה מוסדית",s:"סיכום",q:"מהי קנייה ארגונית (מוסדית) לפי הסיכום?",o:["תהליך החלטה שבו ארגון פורמלי קובע צורך ברכישה ובוחר ספקים","רכישה חוזרת של אותו מוצר מתוך הרגל, במעורבות נמוכה של הקונה","תהליך שבו הספק קובע עבור הארגון את המפרט, את הכמות ואת מחיר הרכישה","רכישה שמבצע עובד בודד עבור עצמו, על חשבון הארגון שבו הוא מועסק","גישה שיווקית שבה מתאימים מסר ייחודי ועמוד נחיתה לכל אחד מארגוני היעד"],c:0,e:"קנייה ארגונית היא תהליך קבלת החלטות שבאמצעותו ארגונים פורמליים קובעים את הצורך ברכישת מוצרים ושירותים, ומזהים, מעריכים ובוחרים מותגים וספקים. גישה של מסר ייחודי לכל ארגון היא ABM."},
{l:2,t:"לקוחות עסקיים וקנייה מוסדית",s:"סיכום",q:"איזה צירוף מתאר נכון לקוחות עסקיים, בהשוואה לצרכנים פרטיים, לפי טבלת ההשוואה שבמצגת?",o:["מעט קונים, רכישות גדולות, מחזור קנייה קצר, קריטריונים לא פורמליים","הרבה קונים, רכישות גדולות, מחזור קנייה ארוך, קריטריונים לא פורמליים","הרבה קונים, רכישות קטנות, מחזור קנייה קצר, קריטריונים לא פורמליים","מעט קונים, רכישות גדולות, מחזור קנייה ארוך, קריטריונים פורמליים","מעט קונים, רכישות קטנות, מחזור קנייה קצר, קריטריונים פורמליים"],c:3,e:"בקנייה מוסדית כמות הקונים קטנה, הרכישות לרוב גדולות, מחזור הקנייה ארוך והקריטריונים להחלטה פורמליים. בנוסף: מכלול גורמים משתתף בהחלטה, המעורבות גבוהה, והיחסים עם הספק הדוקים."},
{l:2,t:"לקוחות עסקיים וקנייה מוסדית",s:"סיכום",q:"כיצד מתואר הביקוש של לקוחות עסקיים בטבלת ההשוואה שבמצגת?",o:["משתנה לפי הקונה","קשיח וגזור","אקראי ולא צפוי","גמיש ועונתי","תלוי במוצר"],c:1,e:"אצל לקוחות עסקיים הביקוש מתואר כ«קשיח וגזור». אצל צרכנים פרטיים הוא «תלוי במוצר»."},
{l:2,t:"לקוחות עסקיים וקנייה מוסדית",s:"יישום",q:"בית חולים עומד לרכוש מערכת דימות. מה מהבאים הכי פחות מתאים לקנייה מוסדית, לפי הסיכום?",o:["ההחלטה מתקבלת בנקודת המכירה, לפי התרשמות של אדם אחד","אחרי הרכישה נאסף משוב על המערכת מגורמים שונים בארגון","לפני חתימת החוזה מתקיימות כמה פגישות מכר אישיות עם הספק","בהחלטה מעורבים כמה גורמים בארגון, ונדרשים אישורים ושלבים פורמליים","ההצעות של הספקים נבחנות לעומק מול מפרט שהוגדר מראש"],c:0,e:"בקנייה מוסדית התהליך מורכב יותר: יותר גורמים מעורבים בהחלטה, ויותר אישורים ושלבים פורמליים, כי הרכישות גדולות ובעלות השלכות כלל ארגוניות. החלטה מהירה של פרט בנקודת המכירה מתאימה לצרכן פרטי."},
{l:2,t:"לקוחות עסקיים וקנייה מוסדית",s:"סיכום",q:"אילו שלבים מופיעים בתהליך של לקוח עסקי, ואינם מופיעים כשלבים נפרדים אצל צרכן פרטי, לפי השקף?",o:["חזרה על הקנייה מתוך הרגל, או חיפוש מגוון בין מותגים","הכרה בצורך בתחילת התהליך, והערכה אחרי הקנייה בסופו","חשיפה לגירוי, הפניית קשב אליו ופרשנות ראשונית שלו","איסוף ועיבוד מידע, ואחריו גיבוש עמדות והחלטת קנייה","הגדרת הצורך, מפרט המוצר, חיפוש ספקים וחתימת חוזה"],c:4,e:"אצל לקוח עסקי השלבים הם: הכרה בצורך וזיהוי הבעיה, הגדרת הצורך, מפרט המוצר, חיפוש ספקים, פגישות והצעות, הערכה מעמיקה מול מכלול גורמים בארגון, סיכום הצעה וחתימת חוזה, והערכה לאחר קנייה. אצל צרכן פרטי ארבעה שלבים בלבד."},
{l:2,t:"לקוחות עסקיים וקנייה מוסדית",s:"סיכום",q:"האם ללקוחות עסקיים יש גם צרכים רגשיים, לפי הסיכום?",o:["לא. צרכים רגשיים שייכים לפירמידה של הצרכנים הפרטיים בלבד","כן, אבל רק בארגונים קטנים שבהם הבעלים הוא גם מי שקונה","כן. למשל תועלות אישיות לעובדי הארגון, כמו הנאה בעבודה","לא. בקנייה מוסדית רלוונטיים רק המחיר והמפרט הטכני של המוצר","כן, והם חשובים מהצרכים השימושיים בכל קנייה מוסדית"],c:2,e:"התועלות של לקוחות עסקיים מתמקדות יותר בצרכים שימושיים, אבל גם בתהליך רכישה מוסדי יכולים להיות צרכים רגשיים, שמספקים תועלות רגשיות או אישיות לעובדי הארגון, כמו הנאה בעבודה או התפתחות אישית."},
{l:2,t:"לקוחות עסקיים וקנייה מוסדית",s:"יישום",q:"חברת שוברי מתנה פונה למנהלות משאבי אנוש בעיצוב צהוב ובמסרים של אושר וכיף לעובדים. מה אפשר ללמוד מכך, לפי הסיכום?",o:["שצבע משפיע רק על הזיכרון לטווח קצר של מקבלי ההחלטות","שהפנייה מיועדת בפועל לצרכנים פרטיים, ולא לארגונים עצמם","שגם בפנייה ללקוחות עסקיים רלוונטיים ערכים רגשיים ומסרים עקיפים","שדרישות הסף של הארגון הוחלפו אצלה בערכים של השראה","שהחברה טועה, כי לקוחות עסקיים מגיבים רק לנתוני עלות ותועלת"],c:2,e:"זו דוגמת BUYME מהסיכום: גם בפנייה ללקוחות עסקיים החברה מדגישה אושר וכיף, ומשתמשת במסרים רגשיים ועקיפים, לא רק מילוליים, כמו הצבע הצהוב."},

{l:2,t:"פירמידת B2B וגישת ABM",s:"מרצה",q:"ספק תוכנה לארגונים מציג ללקוח עסקי כי המערכת עומדת בדרישות אבטחה ורגולציה, מאפשרת להתרחב בקלות עם צמיחת החברה, מקצרת תהליכי עבודה וגם מסייעת למנהל הפרויקט להצליח בתפקידו. איזו טענה מדויקת לפי פירמידת הערכים ללקוחות עסקיים של BAIN?",o:["כל ארבעת הערכים שייכים לדרישות סף בלבד.","המסר משלב דרישות סף, ערכים פונקציונליים, הקלה על תהליך העבודה ואף ערך אישי לעובד בארגון.","ערך אישי אינו רלוונטי לעולם B2B ולכן אינו אמור להופיע בהצעה.","יכולת צמיחה של המערכת היא ערך רגשי ולא פונקציונלי.","ככל שמדובר ברכישה ארגונית, יש להתמקד רק במחיר ובמפרט הטכני."],c:1,e:"לפי המפתח של המרצה. אבטחה ורגולציה הן דרישות סף, יכולת התרחבות (scalability) היא ערך פונקציונלי, קיצור תהליכי עבודה הוא הקלה על תהליך העבודה, והצלחת מנהל הפרויקט בתפקידו היא ערך אישי."},
{l:2,t:"פירמידת B2B וגישת ABM",s:"מרצה",q:"חברת ייעוץ מעוניינת לעבוד בגישת ABM מול שלושה ארגונים גדולים. איזה מהמהלכים הבאים הכי פחות מתאים לגישה זו?",o:["למפות בכל ארגון את מקבלי ההחלטות המרכזיים ואת התפקיד שלהם בתהליך הרכישה.","להתאים את המסר לצרכים ולערכים הספציפיים של כל ארגון.","לבנות עמוד נחיתה שונה עבור ארגון יעד מרכזי.","להכיר גם מטרות מקצועיות וגם שיקולים אישיים של מקבלי החלטות.","להפיץ מסר אחיד וזהה לאלפי ארגונים ללא הבחנה, משום שהיעילות נובעת בעיקר מהיקף החשיפה."],c:4,e:"לפי המפתח של המרצה. ב-ABM המשווקת לומדת לעומק על ארגון היעד ועל מקבלי ההחלטות בו, ומתאימה לו פנייה ייחודית. מסר אחיד לאלפי ארגונים הוא ההפך מהגישה."},
{l:2,t:"פירמידת B2B וגישת ABM",s:"סיכום",q:"מה ההבדל המבני בין שתי פירמידות הערכים של BAIN?",o:["בשתיהן חמש קבוצות, אבל ללקוחות עסקיים יש 40 ערכים ולא 30 ערכים","לצרכנים פרטיים 30 ערכים בארבע קבוצות, וללקוחות עסקיים 40 ערכים בחמש קבוצות","בשתיהן 30 ערכים, אבל ללקוחות עסקיים הם מסודרים בחמש קבוצות ולא בארבע","לצרכנים פרטיים 40 ערכים בחמש קבוצות, וללקוחות עסקיים 30 ערכים בארבע קבוצות","לצרכנים פרטיים 30 ערכים בחמש קבוצות, וללקוחות עסקיים 40 ערכים בארבע קבוצות"],c:1,e:"לצרכנים פרטיים: 30 ערכים שמתקשרים לארבע קבוצות צרכים. ללקוחות עסקיים: 40 ערכים שמסווגים בחמש קבוצות צרכים."},
{l:2,t:"פירמידת B2B וגישת ABM",s:"סיכום",q:"באיזה סדר מופיעות חמש קבוצות הערכים בפירמידת B2B של BAIN, מהבסיס ועד הקודקוד?",o:["דרישות סף, פונקציונליים, הקלה על תהליך העבודה, אישיים, השראה","דרישות סף, אישיים, פונקציונליים, הקלה על תהליך העבודה, השראה","דרישות סף, הקלה על תהליך העבודה, פונקציונליים, השראה, אישיים","השראה, אישיים, הקלה על תהליך העבודה, פונקציונליים, דרישות סף","פונקציונליים, דרישות סף, אישיים, הקלה על תהליך העבודה, השראה"],c:0,e:"בבסיס דרישות הסף (Table stakes), מעליהן הערכים הפונקציונליים, אחריהם ההקלה על תהליך העבודה (Ease of doing business), אחריהם הערכים האישיים (Individual), ובקודקוד ערכי ההשראה (Inspirational)."},
{l:2,t:"פירמידת B2B וגישת ABM",s:"יישום",q:"פלטפורמה לבניית אתרים פונה לעסקים במסר: «המערכת תגדל יחד איתכם: עוד לקוחות, עוד מוצרים, עוד מכירות». לאיזה ערך בפירמידת B2B היא פונה?",o:["ערך אישי, כי הוא תורם לקריירה של המנהל","דרישת סף, כי כל ספק חייב לעמוד בה","ערך של השראה, כי צמיחה היא סוג של חזון","הקלה על תהליך העבודה, כי הוא חוסך זמן","ערך פונקציונלי: scalability"],c:4,e:"scalability, היכולת של המשאב שהספק נותן לעזור לארגון לצמוח ולגדול, הוא ערך פונקציונלי. זו דוגמת וויקס מהסיכום, ששמה דגש על מונחים כמו צמיחה."},
{l:2,t:"פירמידת B2B וגישת ABM",s:"יישום",q:"ספק שירותי ענן מדגיש בהצעה ללקוח עסקי: מגוון שירותים, אמינות, ותגובה מהירה של צוות התמיכה. לאיזו קבוצה בפירמידת B2B שייכים הערכים האלה?",o:["ערכים פונקציונליים","ערכים אישיים של העובדים","דרישות סף, בבסיס הפירמידה","הקלה על תהליך העבודה","ערכי השראה, בקודקוד הפירמידה"],c:3,e:"הקבוצה «הקלה על תהליך העבודה» מחולקת לתת קטגוריות: ערכים שתורמים לנגישות (למשל מגוון), למערכת היחסים עם הספק (למשל אמינות ותגובתיות) ולתפוקה."},
{l:2,t:"פירמידת B2B וגישת ABM",s:"יישום",q:"חברת הדרכה מציעה לארגון קורס, ומדגישה בפני מנהל הרכש: «הקורס יקדם גם את הקריירה שלך, והעובדים ייהנו ממנו». לאיזו קבוצה בפירמידת B2B פונה המסר?",o:["ערכים אישיים","ערכים פונקציונליים","הקלה על תהליך העבודה","דרישות סף","ערכי השראה"],c:0,e:"בקבוצת הצרכים האישיים נמצאים ערכים שתורמים לעובדים עצמם בארגון: חוויה של הנאה ופינוקים בעבודה, או תרומה אישית לקריירה שלהם."},
{l:2,t:"פירמידת B2B וגישת ABM",s:"יישום",q:"עמוד נחיתה שפונה לסוכנויות פרסום מדגיש: «הצטרפו לחזון שלנו, ולאחריות שלנו כלפי הקהילה». באיזו קבוצה בפירמידת B2B נמצאים הערכים האלה?",o:["הקלה על תהליך העבודה מול הספק","ערכי השראה, בקודקוד","ערכים פונקציונליים, כמו צמיחה","ערכים אישיים של העובדים","דרישות סף, בבסיס הפירמידה"],c:1,e:"בקבוצה הגבוהה ביותר, צרכי ההשראה, נמצאים ערכים כמו חזון ואחריות תאגידית. הדוגמה בסיכום: עמוד הנחיתה של וויקס לסוכנויות, עם מסרים של תרומה לחזון."},
{l:2,t:"פירמידת B2B וגישת ABM",s:"יישום",q:"ספק מציין בהצעה: «המוצר עומד במפרט, המחיר מקובל, ואנחנו עומדים בדרישות הרגולציה ובכללי האתיקה». מה נכון לגבי הערכים האלה בפירמידת B2B?",o:["אלה ערכי השראה, ולכן הם שמבדלים את הספק ממתחריו","אלה ערכים פונקציונליים, כמו scalability וחדשנות","אלה דרישות סף: תועלות נדרשות, בבסיס הפירמידה","אלה ערכים אישיים, כי הם מרגיעים את מקבל ההחלטה","אלה ערכים של מערכת יחסים, כמו תגובתיות ומומחיות"],c:2,e:"בתחתית הפירמידה נמצאות «דרישות הסף»: תועלות נדרשות, כמו דרישות אתיות, משפטיות, כספיות או טכניות אחרות."},
{l:2,t:"פירמידת B2B וגישת ABM",s:"סיכום",q:"מה מאפיין את גישת ABM לפי הסיכום?",o:["מסר אחיד שמופץ לשוק רחב ככל האפשר, כדי להוזיל את עלות החשיפה לכל ארגון","התמקדות בדרישות הסף של הארגון, בלי להתייחס לשיקולים אישיים של העובדים","פנייה לצרכנים פרטיים לפי נתוני הגלישה שלהם, בלי מעורבות של אנשי מכירות","ויתור על פגישות אישיות, והעברת כל תהליך המכירה לארגון לערוצים דיגיטליים","לימוד מעמיק של ארגון היעד ומקבלי ההחלטות, ופנייה ייחודית אליו"],c:4,e:"בגישת ABM המשווקת לומדת לעומק על הארגון ועל מקבלי ההחלטות בו, ברמה האישית וברמה המקצועית. היא מתאימה פנייה ייחודית לארגון ולדמות מסוימת בו, כמו המנכ״לית, ומפנה את המסר לעמוד נחיתה מותאם."},
{l:2,t:"פירמידת B2B וגישת ABM",s:"סיכום",q:"מה ממליץ הסיכום לגבי פנייה לערכים של לקוחות עסקיים?",o:["לפנות לערך אחד בלבד בכל מרכיבי ההצעה, כדי לא לבלבל את מקבלי ההחלטות","להחליף את הערכים השימושיים ברגשיים, כמו אצל צרכנים פרטיים","להתמקד בערכים שבבסיס הפירמידה, כי רק הם משפיעים בפועל על החלטת הרכש","לפנות גם לערכים אישיים ולערכים גבוהים: יותר ערכים, יותר שביעות רצון","לוותר על הערכים השימושיים, כי כל הספקים עומדים בהם ממילא"],c:3,e:"גם אצל לקוחות עסקיים פנייה ליותר ערכים מגדילה שביעות רצון. נכון לפנות לא רק לערכים הבסיסיים שבתחתית הפירמידה, אלא גם לערכים האישיים של עובדי הארגון ולערכים הגבוהים של חזון ואחריות תאגידית."},
]);

/* ===================== יחידה 3 — תפיסה: חשיפה, קשב, פרשנות ===================== */
{l:3,t:"חשיפה וספים",s:"מרצה",q:"בכניסה לחנות מופץ ריח בעוצמה נמוכה מאוד. הלקוחות אינם מדווחים שהם מודעים לריח, אך ייתכן שהוא עדיין משפיע על תחושתם. איזה מושג מתאים ביותר לתיאור המצב?",o:["גירוי תת-ספי שנמצא מתחת לסף המוחלט של המודעות.","סף ההבחנה בהבדל לפי חוק ובר.","קשב רצוני מסוג Top-Down.","חסימה לאחור בזיכרון לטווח ארוך.","חוק הסגירות של הגשטלט."],c:0,e:"לפי המפתח של המרצה. גירוי שעוצמתו נמוכה מהסף המוחלט מכונה תת ספי: הוא יכול להיקלט בחושים, וייתכן שאף להשפיע, אבל איננו מודעים אליו. סף ההבחנה בהבדל עוסק בשינוי בגירוי, ולא בעצם קליטתו."},
{l:3,t:"חשיפה וספים",s:"סיכום",q:"מהו הסף המוחלט לפי הסיכום?",o:["מספר גושי המידע המרבי שאפשר להחזיק בזיכרון לטווח קצר","רמת הקשב המינימלית שנדרשת כדי לקודד מידע לטווח ארוך","השינוי הקטן ביותר בגירוי שהצרכן מסוגל להבחין בו","עוצמת הגירוי המינימלית שנדרשת כדי לקלוט אותו בחושים","עוצמת הגירוי המרבית שהחושים מסוגלים לשאת בלי להינזק"],c:3,e:"הסף המוחלט הוא עוצמת הגירוי המינימלית שנדרשת כדי שהצרכן יהיה מסוגל לקלוט את הגירוי בחושיו. השינוי הקטן ביותר שמבחינים בו שייך לסף ההבחנה בהבדל."},
{l:3,t:"חשיפה וספים",s:"סיכום",q:"מה נכון לגבי גירוי תת ספי, לפי הסיכום?",o:["הוא אינו נקלט בחושים כלל, ולכן אינו יכול להשפיע על הצרכן בשום דרך","הוא נקלט רק כשהצרכן מפנה אליו קשב רצוני","הוא שינוי בגירוי קיים, שקטן מסף ההבחנה בהבדל","עוצמתו גבוהה מהסף המוחלט, ולכן הוא מושך אליו קשב לא רצוני","הוא יכול להיקלט בחושים ואולי להשפיע, אבל איננו מודעים אליו"],c:4,e:"גירוי שעוצמתו נמוכה מהסף המוחלט מכונה תת ספי. הוא יכול להיקלט בחושים, וייתכן שאף להשפיע, אבל איננו מודעים אליו."},
{l:3,t:"חשיפה וספים",s:"סיכום",q:"מה קובע חוק ובר?",o:["גירוי שנקלט ביותר מחוש אחד נזכר טוב יותר מגירוי שנקלט בחוש יחיד","ככל שהגירוי הראשוני גדול יותר, נדרש שינוי גדול יותר כדי שהשינוי ייתפס","השלם שונה מסכום חלקיו, ולכן אין טעם לפרק את הגירוי למרכיביו","ככל שהגירוי הראשוני גדול יותר, די בשינוי קטן יותר כדי שהשינוי ייתפס","כל שינוי בגירוי נתפס באותה מידה, בלי קשר לעוצמת הגירוי הראשוני"],c:1,e:"לפי חוק ובר, ככל שהגירוי הראשוני גדול יותר, כך נדרש שינוי גדול יותר כדי שהפרט יהיה מסוגל לתפוס את השינוי. «השלם שונה מסכום חלקיו» הוא משפט המפתח של הגשטלט."},
{l:3,t:"חשיפה וספים",s:"יישום",q:"מחיר של מוצר שעולה 10 שקלים ומחיר של מוצר שעולה 200 שקלים עולים שניהם בשני שקלים. מה צפוי לפי חוק ובר?",o:["ההעלאה תורגש יותר במוצר היקר, כי בוחנים אותו בתשומת לב רבה","ההעלאה תורגש רק אצל צרכנים שמעורבותם במוצר גבוהה","ההעלאה תורגש יותר במוצר הזול, כי שם הגירוי הראשוני קטן","ההעלאה תורגש באותה מידה בשני המוצרים, כי השינוי במחיר זהה","ההעלאה לא תורגש באף מוצר, כי שני שקלים הם מתחת לסף המוחלט"],c:2,e:"סף ההבחנה תלוי בגירוי הראשוני. כשהגירוי הראשוני גדול (200 שקלים) נדרש שינוי גדול יותר כדי להבחין בו, ולכן אותם שני שקלים בולטים הרבה יותר במוצר של 10 שקלים."},
{l:3,t:"חשיפה וספים",s:"יישום",q:"יצרן חטיפים מקטין את תכולת השקית בכמה גרמים, ומקווה שהצרכנים לא ירגישו. על מה הוא נשען, ומה נכון לגבי המהלך לפי הסיכום?",o:["על סף ההבחנה בהבדל. שינוי לרעת הצרכן צריך להיכתב על האריזה","על חסימה לאחור. האריזה החדשה משכיחה את האריזה הישנה","על הסף המוחלט. המהלך מותר בכל מקרה, כי הצרכן אינו נפגע ממנו ואינו מרגיש בו","על חוק הסגירות. הצרכן משלים בעצמו את הכמות שחסרה בשקית","על קשב רצוני. הצרכן יבחין בשינוי רק אם הוא מחפש אותו באופן פעיל"],c:0,e:"שינוי קטן מסף ההבחנה בהבדל לא ייקלט. המשווקת בוחרת אם ליצור מודעות לשינוי או שהצרכן לא יחוש בו. מבחינה רגולטורית, שינוי של תנאי המוצר לרעת הצרכן צריך להיכתב בצורה ברורה על המוצר או האריזה, אף שלא כולם מקפידים והנושא לא נאכף בקפידה."},
{l:3,t:"חשיפה וספים",s:"יישום",q:"יצרן שיפר את חיי הסוללה של מכשיר, ורוצה שהצרכנים ישימו לב לשיפור. מה נובע מהסיכום?",o:["אין צורך להבליט, כי כל שינוי לטובת הצרכן נתפס מעצמו","די בכך שהשיפור עובר את הסף המוחלט, בלי קשר לגודל השינוי","השיפור צריך לעבור את סף ההבחנה, ולכן כדאי להבליט אותו","השיפור צריך להיות קטן מסף ההבחנה, כדי שלא יעורר ביקורת","השיפור ייתפס רק אם הוא מוצג כגירוי תת ספי בנקודת המכירה"],c:2,e:"כדי שהחושים יקלטו שינוי בגירוי, השינוי צריך להיות בעוצמה מספקת, אחרת לא נחוש בו. כשהשינוי מיטיב עם הצרכן, המשווקת רוצה ליצור מודעות אליו, ולכן עליו לעבור את סף ההבחנה בהבדל."},
{l:3,t:"חשיפה וספים",s:"סיכום",q:"באיזו צורה נקלטים הגירויים בשלב החשיפה, לפי הסיכום?",o:["בצורתם הגולמית: צליל, קו או אות, ללא משמעות","כמשמעויות מוכנות, שנשלפות מהזיכרון לטווח ארוך","כגושי מידע מאורגנים, עד תשעה גושים בכל פעם","כתסריט פעולה אוטומטי, שאינו דורש מאמץ","כדמות שמובחנת מהרקע, לפי חוקי הגשטלט"],c:0,e:"בשלב החשיפה הגירויים נקלטים בחושים בצורתם הגולמית: צליל, קו, אות, ללא משמעות. המשמעות ניתנת בשלב הפרשנות."},
{l:3,t:"חשיפה וספים",s:"סיכום",q:"למה כדאי, לפי הסיכום, לשלב במסר מידע חזותי עם מידע מילולי או עובדתי?",o:["כי כל חוש קולט רק מסר אחד, ולכן שני מסרים נקלטים טוב ממסר אחד","כי מידע מילולי נשמר בטווח הקצר, ומידע חזותי רק בטווח הארוך","כי מידע חזותי עוקף את הסף המוחלט, ומידע מילולי את סף ההבחנה","כי מידע חזותי מושך קשב רצוני, ומידע מילולי קשב לא רצוני","כי השילוב מפעיל את שני חצאי המוח, ויוצר קשרים חזקים יותר"],c:4,e:"מידע חזותי מפעיל את החצי הימני של המוח, ומידע תוכני, עובדתי או מילולי מפעיל את החצי השמאלי. תפיסת המידע דרך יותר אזורים במוח יוצרת יחידת למידה משמעותית: גירוי שיש לו קשרים חזקים יותר."},
{l:3,t:"חשיפה וספים",s:"יישום",q:"מאפייה תולה שלט עם המילה «טרי», מפיצה ריח של אפייה, ומשמיעה את המילה גם בכריזה. מה ההיגיון לפי הסיכום?",o:["ריבוי החושים מוריד את הגירוי מתחת לסף המוחלט של הלקוח","הריח הוא הדמות, והשלט והכריזה משמשים לו רקע","שלושת הגירויים קרובים זה לזה, ולכן נתפסים כמוצר אחד","כל חוש קולט את חלקו, והגירוי נקלט דרך יותר ערוצים","חזרה על המילה מתגברת על מגבלת הקיבולת של הזיכרון"],c:3,e:"כל חוש קולט בנפרד את החלק בגירוי שנוגע אליו. כשרואים את המילה «טרי» וגם שומעים אותה, הגירוי נקלט דרך יותר ערוצים, ולכן נכון לחשוף את הצרכן למסר תוך הפעלה של חושים שונים."},

{l:3,t:"קשב",s:"מרצה",q:"צרכנית מחפשת כבר שבוע מידע על מצלמות לטיול. בזמן שהיא קוראת כתבה רגילה מופיעה בצד העמוד מודעה פשוטה למצלמה, ללא צבע חריג, תנועה או צליל, והיא מיד מבחינה בה. מה מסביר בצורה הטובה ביותר את הקשב שלה?",o:["קשב לא-רצוני בלבד, משום שכל פרסומת היא גירוי חיצוני.","סף מוחלט נמוך במיוחד שנוצר בעקבות חוק ובר.","עקרון דמות ורקע בלבד, משום שמודעה תמיד הופכת לדמות.","קשב רצוני מסוג Top-Down הנובע מהרלוונטיות של הגירוי לצורך ולנושא שמעסיק אותה.","חסימה לפנים, משום שהידע הקודם על מצלמות מפריע לעיבוד המודעה."],c:3,e:"לפי המפתח של המרצה. המודעה אינה בולטת בעצמה (אין צבע חריג, תנועה או צליל), ולכן הקשב אינו בא מהגירוי. הוא בא מהצרכנית: המסר נוגע לצורך ולנושא שמעסיק אותה, וזה יוצר עירנות תפיסתית. זהו קשב רצוני, Top-Down."},
{l:3,t:"קשב",s:"סיכום",q:"מהו קשב לפי הסיכום?",o:["תרגום המידע מהחושים לצורת ייצוג מקובלת בזיכרון","ההחלטה באילו גירויים למקד את תשומת הלב","עוצמת הגירוי המינימלית שנדרשת כדי לקלוט אותו בחושים","מידת החשיבות שהצרכן מייחס למוצר או לקנייה","ארגון הרשמים מהחושים וזיהוים כעצם בעל משמעות"],c:1,e:"קשב הוא ההחלטה באילו גירויים למקד את תשומת הלב. ארגון הרשמים ומתן משמעות הוא פרשנות, תרגום המידע לייצוג בזיכרון הוא קידוד, ומידת החשיבות היא מעורבות."},
{l:3,t:"קשב",s:"סיכום",q:"איזה צירוף מתאר נכון את הקשב שמקורו בגירוי?",o:["קשב לא רצוני, Top-Down: גירוי שהצרכן אינו מודע אליו","קשב לא רצוני, Bottom-Up: גירוי בולט או לא צפוי","קשב תת ספי: גירוי שעוצמתו נמוכה מהסף המוחלט","קשב רצוני, Top-Down: גירוי שפונה לצרכים של הצרכן","קשב רצוני, Bottom-Up: גירוי שהצרכן מחפש באופן פעיל"],c:1,e:"קשב שמקורו בגירוי הוא קשב לא רצוני, Bottom-Up: גירוי בעוצמה גבוהה מהרגיל, בולט, יוצא דופן או לא צפוי, שנקלט בחושים בגלל עוצמתו."},
{l:3,t:"קשב",s:"סיכום",q:"מה יוצר קשב רצוני (Top-Down), לפי הסיכום?",o:["גירוי בעוצמה גבוהה מהרגיל, שבולט על רקע סביבה סטטית","גירוי שמוצג מתחת לסף המוחלט, בלי שהצרכן מודע אליו","גירוי שמוצמד למוצר אחר, ונתפס כחלק מאותה קבוצה","גירוי שפונה לצרכים של הצרכן ולנושאים שחשובים לו","גירוי שחוזר פעמים רבות, עד שהצרכן מפסיק להתנגד לו"],c:3,e:"קשב שמקורו בצרכן הוא קשב רצוני, Top-Down: גירוי שפונה לתובנה הצרכנית, לצרכים של הצרכן ולנושאים שחשובים לו, במקום שבו הוא אכן מעוניין במוצר. מסר כזה יוצר עירנות תפיסתית."},
{l:3,t:"קשב",s:"יישום",q:"בחלון ראווה כל המוצרים מוצגים בתצוגה סטטית, ורק מוצר אחד מסתובב על מעמד נע. העוברים ושבים מביטים בו גם בלי שהתכוונו. איזה סוג קשב זה?",o:["אין כאן קשב אלא פרשנות, לפי חוק הרציפות הטובה","קשב תת ספי, כי התנועה נמוכה מהסף המוחלט","קשב רצוני, Top-Down, כי המוצר רלוונטי לצורך שלהם","קשב רצוני, Bottom-Up, כי הם בחרו להביט בחלון","קשב לא רצוני, Bottom-Up, כי מקורו בבולטות של הגירוי"],c:4,e:"מוצר בתצוגה דינמית, כשכל שאר התצוגה סטטית, הוא הדוגמה שבסיכום לגירוי יוצא דופן שיוצר בולטות. הקשב בא מהגירוי: לא רצוני, Bottom-Up."},
{l:3,t:"קשב",s:"יישום",q:"לקראת חג הפסח, אפליקציית משלוחים מאפשרת ללקוחות לתרום דרכה מארזי מזון למשפחות נזקקות. באיזה מקור קשב המהלך משתמש, לפי התשובה שבסיכום?",o:["קשב שמקורו בצרכן, כי המהלך נוגע לנושאים שקרובים לליבו","קשב שמקורו בגירוי, כי חג הפסח הוא גירוי חיצוני","קשב שמקורו בגירוי, כי המהלך בולט ויוצא דופן","קשב לא רצוני, כי הצרכן נחשף למהלך בלי שבחר בכך","קשב תת ספי, כי המסר על התרומה מוצג ברקע האפליקציה"],c:0,e:"זו שאלת התרגול על «וולט» שבסיכום, והתשובה שם: הטענה שמדובר בקשב שמקורו בגירוי אינה נכונה. זהו קשב רצוני, שמקורו בצרכן: המהלך פונה לנושאים שקרובים לליבו, כמו תרומה לקהילה, ובהקשר של החג."},
{l:3,t:"קשב",s:"יישום",q:"אב לתינוקת בת חודש הולך בקניון, ומבחין מיד בשלט קטן ואפור של חנות עגלות. חברו, שאין לו ילדים, לא ראה את השלט בכלל. מה מסביר את ההבדל?",o:["אצל החבר התרחשה התקה בזיכרון לטווח קצר","לאב סף מוחלט נמוך יותר, ולכן הוא קולט גירויים חלשים","השלט רלוונטי לצורך של האב, וזה יוצר עירנות תפיסתית","האב משלים את המידע שחסר בשלט, לפי חוק הסגירות","השלט בולט ויוצא דופן בסביבה, ולכן הוא יוצר אצל האב קשב לא רצוני"],c:2,e:"השלט עצמו אינו בולט, ולכן אין כאן קשב שמקורו בגירוי. המסר פונה לצורך של האב ולנושא שחשוב לו, וזה יוצר עירנות תפיסתית שמשפיעה על הקליטה בחושים: קשב רצוני, Top-Down."},
{l:3,t:"קשב",s:"יישום",q:"חברה רוצה להגביר קשב שמקורו בצרכן, ולא קשב שמקורו בגירוי. מה עליה לעשות?",o:["להגדיל את המודעה, ולהוסיף לה תנועה וצליל פתאומי","להפיץ ריח בעוצמה נמוכה, שהלקוחות אינם מודעים אליו","להציב את המוצר ליד מוצרים יוקרתיים, כדי שיתפסו אותו כמוהם","לבנות מסר סביב צורך שמעסיק את קהל המטרה שלה","להציג את המוצר בצבע שחורג מכל שאר המוצרים שעל המדף"],c:3,e:"קשב רצוני נוצר כשהמסר פונה לתובנה הצרכנית ולנושאים שחשובים לצרכן, במקום שבו הוא אכן מעוניין במוצר. גודל, תנועה, צליל וצבע חריג הם דרכים ליצור קשב שמקורו בגירוי."},

{l:3,t:"פרשנות וגשטלט",s:"מרצה",q:"בדף תשלום באתר כפתור 'המשך לתשלום' גדול, מבודד וברור, בעוד מידע משני מוצג בצורה פחות בולטת סביבו. איזה עיקרון תפיסתי מיושם בעיקר?",o:["דמיון, משום שכל הפריטים בדף צריכים להיראות זהים.","דמות ורקע, משום שהכפתור מוגדר כמרכיב המרכזי שאליו רוצים לכוון את הקשב.","סגירות, משום שהצרכן משלים מידע חסר בכפתור.","חסימה לאחור, משום שהכפתור דוחק מידע קודם.","התניה אופרנטית, משום שלחיצה על הכפתור היא פעולה."],c:1,e:"לפי המפתח של המרצה. דמות ורקע: המשווקים מחליטים מהו המסר העיקרי, ומבליטים אותו כדמות, והמידע המשני נשאר ברקע. בסיכום הדוגמה היא כפתור שתורם להגדלת יחס ההמרה."},
{l:3,t:"פרשנות וגשטלט",s:"סיכום",q:"איזה משפט מתמצת את תיאוריית הגשטלט?",o:["השלם שונה מסכום חלקיו","מה שנקלט בלי קשב נמחק על ידי הגירוי הבא","מידע חדש דוחק מידע ישן","ככל שהגירוי גדול יותר, נדרש שינוי גדול יותר כדי להבחין בו","התועלת הנתפסת צריכה לעלות על העלות הנתפסת"],c:0,e:"משפט המפתח של הגשטלט: «השלם שונה מסכום חלקיו». באדם יש תבנית תודעתית ראשונית שמפרשת את הגירויים החושיים, ואף משליכה את חוקיה על הקלט החושי."},
{l:3,t:"פרשנות וגשטלט",s:"סיכום",q:"בניסוי של ורטהיימר הוקרנו שני הבזקי אור משתי נקודות שונות, בהפרשי זמן קצרים. מה ראו הנבדקים, ומה הסיק מכך ורטהיימר?",o:["שני הבזקים באותו מקום. המוח מעדיף צורות פשוטות וסימטריות","נקודת אור אחת שנעה. התודעה משליכה תבנית על הקלט החושי","שני הבזקים נפרדים. התפיסה נאמנה לחלוטין לקלט החושי","נקודת אור אחת קבועה. ההבזק השני דחק את הראשון מהזיכרון","שום דבר. גירוי קצר כל כך נשאר מתחת לסף המוחלט"],c:1,e:"הנבדקים ראו את שני ההבזקים כנקודת אור בודדת שנעה ממקום למקום, אף שלא הייתה שום תנועה. ורטהיימר הסיק שהתודעה היא שהשליכה את תבנית תפיסת התנועה על הקלט החושי, ונתנה פירוש לגירויים."},
{l:3,t:"פרשנות וגשטלט",s:"סיכום",q:"מהו חוק דמות ורקע?",o:["עצמים שקרובים בזמן ובמרחב משויכים זה לזה","האדם משלים מידע חסר, כך שלתבנית יהיו גבולות ברורים","אלמנטים שמסודרים על קו נתפסים כקשורים זה לזה","אלמנטים שדומים זה לזה חזותית נתפסים כקבוצה אחת","האדם מבחין בין עיקר הקשב לבין המידע המשני שסביבו"],c:4,e:"דמות ורקע הוא החוק היסודי ביותר של התפיסה: האדם מארגן את התפיסה על ידי הבחנה בין דמות, עיקר הקשב, לבין רקע, המידע המשני שיש למקד אליו פחות קשב."},
{l:3,t:"פרשנות וגשטלט",s:"סיכום",q:"מה עלול לקרות כשמטשטשים את ההבחנה בין הדמות לרקע, לפי הסיכום?",o:["הצרכן משייך את המוצר לקבוצה אחרת, לפי חוק הדמיון","המסר יורד מתחת לסף המוחלט, והופך לגירוי תת ספי","זה מכביד על העיבוד, אבל המאמץ יכול ליצור מעורבות","הצרכן מפסיק לעבד את המסר, ולכן זו תמיד טעות עיצובית","שום דבר, כי ההבחנה בין דמות לרקע אינה תלויה בעיצוב"],c:2,e:"טשטוש בין הדמות לרקע יכול להכביד על עיבוד המידע ולהקשות על ההחלטה במה להתמקד. אבל לפעמים דווקא המאמץ של הצרכן להחליט במה להתמקד יוצר מעורבות גבוהה יותר, ועיבוד המידע יהיה עמוק יותר."},
{l:3,t:"פרשנות וגשטלט",s:"יישום",q:"לוגו של חברה בנוי מקווים קטועים, והצופה משלים בעצמו את הצורה לאות שלמה. על איזה חוק גשטלט נשען העיצוב, ומה היתרון השיווקי?",o:["קרבה. הקווים קרובים זה לזה, ולכן הם נזכרים טוב יותר","דמות ורקע. הקווים החסרים הם הרקע של הלוגו","פשטות. צורה חסרה דורשת מהמוח פחות זמן ומשאבים","דמיון. הצופה משייך את הלוגו למותגים שנראים כמוהו","סגירות. המוטיבציה להשלים יוצרת מעורבות ועיבוד מידע מקיף"],c:4,e:"סגירות (השלמה): גם כשהמידע אינו שלם, ננסה לסגור אותו כך שלתבנית יהיו גבולות ברורים. המוטיבציה להשלים יוצרת מעורבות גבוהה יותר ותהליך עיבוד מידע מקיף. יישומים: לוגו או מודעה שמגרים להשלים, טיזר, סיפור מעורר סקרנות."},
{l:3,t:"פרשנות וגשטלט",s:"יישום",q:"רשת מציבה חטיף בריאות ליד האגוזים והפירות, ולא במדף החטיפים, כדי ליצור לו מיצוב בריא. באיזה חוק גשטלט היא משתמשת, לפי התשובה שבסיכום?",o:["קרבה (סמיכות), כי פריטים סמוכים נתפסים כקשורים","רציפות טובה, כי המוצרים מסודרים על מדף אחד","דמיון, כי החטיף נראה כמו האגוזים והפירות שלידו","סגירות, כי הצרכן משלים בעצמו שהחטיף בריא","דמות ורקע, כי החטיף הוא הדמות, והפירות והאגוזים הם הרקע שלו"],c:0,e:"זו שאלת התרגול שבסיכום, והתשובה שם: לא חוק הדמיון, אלא עקרון הסמיכות. פריטים שניצבים בסמיכות נתפסים כחלק מאותה דמות, והצגת החטיף צמוד למוצרי בריאות תורמת לתפיסתו בהקשר בריא."},
{l:3,t:"פרשנות וגשטלט",s:"יישום",q:"חנות מציבה נעלי בד ליד גרביים ואביזרי בד זולים, במקום ליד נעלי נוחות. מה צפוי לקרות לפי הדוגמה שבסיכום?",o:["נעלי הבד יבלטו כדמות, והגרביים יהפכו לרקע שלהן","הצרכנים ישכחו את המיצוב הקודם, בגלל חסימה לאחור","נעלי הבד ישויכו לאביזרי הבד, וייתפסו כנעלי בית בלבד","הצרכנים לא יבחינו בנעלי הבד, כי הן מתחת לסף המוחלט","נעלי הבד ייתפסו כנעליים לשימוש יומיומי, באיכות גבוהה"],c:2,e:"לפי חוק הקרבה, עצמים שקרובים במרחב משויכים זה לזה. ליד נעלי נוחות, נעלי הבד ממוצבות כנעליים לשימוש יומיומי. ליד גרביים הן משויכות לאביזרי הבד, ונתפסות כנעליים לבית בלבד מבחינת איכות ועיצוב."},
{l:3,t:"פרשנות וגשטלט",s:"יישום",q:"באתר של רשת אופנה, כל הפריטים של אותה קטגוריה מוצגים באותו צבע רקע, באותה צורת מסגרת ובאותו גופן. איזה חוק גשטלט מיושם?",o:["קרבה, כי כל הפריטים מוצגים יחד באותו עמוד של האתר","סגירות, כי הגולש משלים בעצמו את הפריטים שחסרים בקטגוריה","רציפות טובה, כי הפריטים מופיעים זה אחר זה","דמיון, כי מאפיינים חזותיים משותפים משייכים יחד","דמות ורקע, כי צבע הרקע מבליט כל פריט"],c:3,e:"לפי חוק הדמיון, אלמנטים שחולקים מאפיינים חזותיים דומים נתפסים כקשורים זה לזה. היישום בסיכום: ארגון אתר כך שכל הפריטים באותו תחום מעוצבים באופן דומה."},
{l:3,t:"פרשנות וגשטלט",s:"יישום",q:"רשת אופנה מציגה באפליקציה קולקציה חדשה בעיצוב שמזכיר יצירות אמנות בתערוכה, והקולקציה נתפסת כייחודית. באיזה חוק גשטלט מדובר, לפי התשובה שבסיכום?",o:["סגירות, כי הגולש משלים בדמיונו את התערוכה","דמיון, כי הקולקציה והיצירות משויכות לאותה דמות","קרבה, כי הבגדים מוצגים ליד יצירות אמנות אמיתיות","פשטות, כי עיצוב של תערוכה הוא נקי ומסודר","דמות ורקע, כי הבגדים הם הדמות והתערוכה היא הרקע"],c:1,e:"זו דוגמת זארה שבסיכום: הקולקציה מעוצבת באופן דומה ליצירות אמנות, ולכן היא והיצירות משויכות לאותה דמות. כך גם הקולקציה נתפסת כמיצג בתערוכה, וזה תורם למיצובה כייחודית."},
{l:3,t:"פרשנות וגשטלט",s:"יישום",q:"בחנות מסודרים מעמדי המבצעים לאורך קו מתעקל אחד, מהכניסה ועד הקופות, והלקוחות תופסים אותם כמסלול אחד. איזה חוק גשטלט מסביר זאת?",o:["סגירות (השלמה)","רציפות טובה","קרבה (סמיכות)","דמיון בין אלמנטים","דמות ורקע"],c:1,e:"לפי חוק הרציפות הטובה (המשכיות), אלמנטים שמאורגנים על קו או על עקומה נתפסים כקשורים יותר מאלמנטים שאינם על קו או עקומה."},
{l:3,t:"פרשנות וגשטלט",s:"יישום",q:"חברה מעצבת עמוד בית נקי: מעט אלמנטים, סדר ברור ומבנה מסודר. על איזה חוק גשטלט היא נשענת, ומה ההסבר שבסיכום?",o:["פשטות. מה שפשוט וברור נתפס כבטוח יותר","קרבה. מעט אלמנטים פירושו שהם רחוקים זה מזה","דמיון. עמוד נקי דומה לעמודים של מותגי יוקרה","סגירות. המוח נהנה להשלים את מה שחסר בעמוד","רציפות טובה. העין נעה בעמוד מלמעלה למטה"],c:0,e:"לפי חוק הפשטות, המוח מעדיף דברים פשוטים, ברורים ומסודרים. הם נתפסים באופן אינסטינקטיבי כבטוחים יותר: הם דורשים מהמוח פחות זמן ומשאבים לזיהוי, ונראים פחות מועדים להפתעות מסוכנות."},
{l:3,t:"פרשנות וגשטלט",s:"סיכום",q:"מה ההבדל בין חוק הקרבה לחוק הדמיון?",o:["קרבה עוסקת בהשלמת מידע חסר, ודמיון בהבחנה בין עיקר לטפל","בקרבה משייכים לפי מאפיינים חזותיים משותפים, ובדמיון לפי סמיכות במרחב","בקרבה משייכים לפי סמיכות בזמן ובמרחב, ובדמיון לפי מאפיינים חזותיים משותפים","אין הבדל: אלה שני שמות לאותו חוק, שנקרא גם חוק הסמיכות","קרבה חלה על מוצרים בחנות פיזית, ודמיון רק על מוצרים באתר"],c:2,e:"קרבה (סמיכות): עצמים שקרובים בזמן ובמרחב נוטים להיות משויכים זה לזה. דמיון: אלמנטים שחולקים מאפיינים חזותיים דומים נתפסים כקשורים. חטיף ליד פירות הוא קרבה, וקולקציה שמעוצבת כמו יצירות אמנות היא דמיון."},
{l:3,t:"פרשנות וגשטלט",s:"סיכום",q:"איזה מהבאים אינו אחד מששת חוקי הגשטלט שנדונו בסיכום?",o:["פשטות","סגירות (השלמה)","רציפות טובה (המשכיות)","דמות ורקע","סף ההבחנה בהבדל"],c:4,e:"ששת החוקים: דמות ורקע, סגירות, קרבה, דמיון, רציפות טובה ופשטות. סף ההבחנה בהבדל שייך לשלב החשיפה, ולא לשלב הפרשנות."},
{l:3,t:"פרשנות וגשטלט",s:"סיכום",q:"מהי פרשנות, לפי הסיכום, ובמה עוסקת אסכולת הגשטלט?",o:["אחסון המידע בזיכרון. הגשטלט עוסק ברשת המשמעויות","בחירה בין חלופות. הגשטלט עוסק בדפוסי קנייה","מיקוד תשומת הלב בגירוי. הגשטלט עוסק במקורות הקשב","ארגון הרשמים מהחושים ומתן משמעות. הגשטלט עוסק בדפוסי הארגון","קליטת הגירוי בחושים. הגשטלט עוסק בעוצמה שנדרשת לקליטה"],c:3,e:"פרשנות היא האופן שבו האדם מארגן את הרשמים שקיבל מהחושים, ומזהה אותם כעצם מסוים ובאופן שנותן משמעות. אסכולת הגשטלט חוקרת את ארגון המידע: תהליך התפיסה מבוסס על דפוסי ארגון, שמשפיעים על הקלט החושי ומעניקים לו משמעות."},
]);

{l:4,t:"זיכרון חושי וטווח קצר",s:"מרצה",q:"לקוח מקבל בקופה קוד הנחה חדש מיד לאחר שקיבל קוד אחר. כשמבקשים ממנו להשתמש בקוד הראשון, הוא מתקשה לזכור אותו משום שהקוד החדש 'תפס את מקומו'. איזה תהליך שכחה בזיכרון לטווח קצר מתואר?",o:["חסימה לפנים.","דעיכה בלבד עקב חלוף זמן רב.","התרמה.","סימטריה ברשת הסמנטית.","התקה - פריט מידע חדש תופס את מקומו של פריט קודם בזיכרון לטווח קצר."],c:4,e:"לפי המפתח של המרצה. שכחה בזיכרון לטווח קצר נגרמת מהתקה או מדעיכה. בהתקה פריט מידע חדש תופס את מקומו של פריט ישן. חסימה לפנים שייכת לזיכרון לטווח ארוך, והיא ההפך: ידע קודם מקשה לזכור מידע חדש."},
{l:4,t:"זיכרון חושי וטווח קצר",s:"סיכום",q:"מהו הסדר הנכון של המאגרים במודל שלושת המאגרים?",o:["זיכרון חושי, זיכרון לטווח ארוך, זיכרון לטווח קצר","זיכרון לטווח קצר, זיכרון חושי, זיכרון לטווח ארוך","זיכרון חושי, זיכרון לטווח קצר, זיכרון לטווח ארוך","זיכרון מרומז, זיכרון מפורש, זיכרון סמנטי","זיכרון סמנטי, תסריט פעולה, זיכרון חושי"],c:2,e:"הגירוי נקלט בזיכרון החושי, עובר לזיכרון לטווח קצר (STM), שהוא תחנת ביניים, ומשם לאחסון בזיכרון לטווח ארוך (LTM), שממנו אפשר לשלוף אותו שוב."},
{l:4,t:"זיכרון חושי וטווח קצר",s:"סיכום",q:"לפי התרשים של מודל שלושת המאגרים, איזה תהליך מעביר מידע מהזיכרון לטווח קצר אל הזיכרון לטווח ארוך?",o:["התקה","קשב","שליפה","קידוד","דעיכה"],c:3,e:"בתרשים: קשב מעביר מהזיכרון החושי לטווח הקצר, קידוד מעביר מהטווח הקצר לטווח הארוך, ושליפה מחזירה מהטווח הארוך. שינון וחזרה מחזיקים את המידע בטווח הקצר, ובלי חזרה המידע לא יקודד."},
{l:4,t:"זיכרון חושי וטווח קצר",s:"סיכום",q:"מהן המגבלות של הזיכרון לטווח קצר, לפי הסיכום?",o:["בזמן: 15 עד 30 שניות. בקיבולת: אין מגבלה","בזמן: 15 עד 30 שניות. בקיבולת: 5 עד 9 גושי מידע","בזמן: אין מגבלה. בקיבולת: 5 עד 9 גושי מידע","בזמן: כמה דקות. בקיבולת: גוש מידע אחד בכל פעם","בזמן: 5 עד 9 שניות. בקיבולת: 15 עד 30 גושי מידע"],c:1,e:"הזיכרון לטווח קצר מוגבל בזמן, 15 עד 30 שניות, ובקיבולת, 5 עד 9 גושי מידע. לכן הוא מתואר כצוואר בקבוק בדרך לזיכרון לטווח ארוך."},
{l:4,t:"זיכרון חושי וטווח קצר",s:"סיכום",q:"איך מקודד המידע בזיכרון לטווח קצר?",o:["בעיקר באופן שמיעתי, אך גם באופן חזותי","באופן לא מודע, דרך הטייס האוטומטי","בעיקר באופן חזותי, ורק לעיתים באופן שמיעתי","לפי משמעות בלבד, בקוד סמנטי","לפי סדר פעולות, בקוד פרוצדורלי"],c:0,e:"הקידוד בזיכרון לטווח קצר הוא בעיקר שמיעתי, אך גם חזותי. הקוד הסמנטי והקוד הפרוצדורלי הם דרכי קידוד בזיכרון לטווח ארוך."},
{l:4,t:"זיכרון חושי וטווח קצר",s:"יישום",q:"חברה מפרסמת את מספר הטלפון שלה כשלוש קבוצות קצרות של ספרות, במקום עשר ספרות נפרדות. על איזו מגבלה היא מתגברת, ואיך?",o:["על הסף המוחלט, בעזרת הגדלה של עוצמת הגירוי","על מגבלת הזמן של הזיכרון לטווח קצר, בעזרת שינון","על חסימה לפנים, בעזרת הפרדה בין מידע ישן לחדש","על מגבלת הקיבולת של הזיכרון לטווח ארוך, בעזרת קידוד סמנטי","על מגבלת הקיבולת של הזיכרון לטווח קצר, בעזרת גושי מידע"],c:4,e:"גוש מידע הוא יחידת מידע מאורגנת ומקובצת מבחינת המשמעות. 7,000 הוא גוש אחד, ואילו הספרות שבע, אפס, אפס, אפס בנפרד הן ארבעה גושים. ארגון המידע במספר מצומצם של גושים, לכל היותר תשעה, מתגבר על מגבלת הנפח."},
{l:4,t:"זיכרון חושי וטווח קצר",s:"סיכום",q:"מה מסייע להתגבר על מגבלת הזמן של הזיכרון לטווח קצר, לפי הסיכום?",o:["הצגת המסר ברקע","הגברת עוצמת הגירוי","קישור המותג ליותר ערכים","שינון וחזרה","ארגון המידע בגושים"],c:3,e:"שינון וחזרה מסייעים להתגבר על מגבלת הזמן, למשל בעזרת תזכורות, או יצירת עניין במסר כך שהצרכנים ירצו לחזור עליו ולהעמיק בו. גושי מידע מתגברים על מגבלת הנפח."},
{l:4,t:"זיכרון חושי וטווח קצר",s:"יישום",q:"לקוחה שומעת ברדיו קוד קופון. היא אינה חוזרת עליו ואינה נחשפת למידע אחר, ואחרי דקה כבר אינה זוכרת אותו. איזה תהליך שכחה מתואר?",o:["התקה","התרמה","דעיכה","חסימה לאחור","חסימה לפנים"],c:2,e:"דעיכה היא שכחה בזיכרון לטווח קצר בגלל הזמן שחלף. בהתקה פריט חדש תופס את מקומו של פריט ישן, וכאן לא נכנס מידע חדש. חסימות שייכות לזיכרון לטווח ארוך."},
{l:4,t:"זיכרון חושי וטווח קצר",s:"סיכום",q:"מה קורה לגירוי שנכנס לזיכרון החושי ואינו נלכד, לפי הסיכום?",o:["הגירוי שבא אחריו מוחק אותו","הוא הופך לגוש מידע, וממתין לשליפה","הוא עובר ישירות לזיכרון לטווח ארוך, בלי קידוד","הוא נשמר כ-15 עד 30 שניות, ואז דועך","הוא נשמר ברשת הסמנטית כקשר חלש"],c:0,e:"אם הגירוי נלכד, כלומר עובר עיבוד מידע, הוא מועבר לזיכרון לטווח קצר. אם לא נלכד, הגירוי שבא אחריו מוחק אותו. זו הנחה שמתייחסת לזיכרון המפורש, המודע."},

{l:4,t:"טווח ארוך והרשת הסמנטית",s:"מרצה",q:"עבור מותג רכב, הצרכנים נוטים לחשוב מיד על 'בטיחות' כאשר הם שומעים את שם המותג. לעומת זאת, כאשר שואלים אותם על 'בטיחות', הם מזכירים כמה מותגים ולא בהכרח את אותו מותג. מה ניתן להסיק?",o:["הרשת הסמנטית בהכרח צפופה מאוד.","הקשר בין המותג לבטיחות בהכרח חלש.","הקשר אינו סימטרי במלואו: המותג מוביל לבטיחות, אך בטיחות אינה מובילה בהכרח למותג.","מדובר בחסימה לאחור.","מדובר בזיכרון לטווח קצר ולא בזיכרון סמנטי."],c:2,e:"לפי המפתח של המרצה. סימטריה: האם מחשבה על המותג מובילה לערך, וגם להפך, מחשבה על הערך מובילה לזכירת המותג. כאן הקשר פועל היטב בכיוון אחד בלבד, ולכן אינו סימטרי במלואו. אין כאן מידע על צפיפות הרשת."},
{l:4,t:"טווח ארוך והרשת הסמנטית",s:"סיכום",q:"מה נכון לגבי הזיכרון לטווח ארוך, לפי הסיכום?",o:["המידע נשמר בו 15 עד 30 שניות","הקידוד בו הוא בעיקר שמיעתי","הוא משמש תחנת ביניים בין שני מאגרים","הוא מוגבל ל-5 עד 9 גושי מידע","הוא אינו מוגבל בזמן או בקיבולת"],c:4,e:"הזיכרון לטווח ארוך אינו מוגבל בזמן או בקיבולת, ומאפשר להחזיק כמויות אדירות של מידע. גם בו יש שכחה: חסימה לאחור וחסימה לפנים."},
{l:4,t:"טווח ארוך והרשת הסמנטית",s:"סיכום",q:"מה ההבדל בין הקוד הסמנטי לקוד הפרוצדורלי בזיכרון לטווח ארוך?",o:["הסמנטי מקודד לפי סדר פעולות (ה«איך»), והפרוצדורלי לפי משמעות (ה«מה»)","הסמנטי מקודד לפי משמעות (ה«מה»), והפרוצדורלי לפי סדר פעולות (ה«איך»)","הסמנטי מקודד בעיקר צלילים, והפרוצדורלי מקודד בעיקר תמונות","הסמנטי שייך לזיכרון לטווח קצר, והפרוצדורלי לזיכרון לטווח ארוך","הסמנטי מוגבל בקיבולת שלו, והפרוצדורלי אינו מוגבל בקיבולת"],c:1,e:"קידוד המידע בזיכרון לטווח ארוך מוסבר בעזרת הקוד הסמנטי, לפי המשמעות של הגירוי, ה«מה». יש גם הקוד הפרוצדורלי, או תסריט פעולה, לפי סדר פעולות, ה«איך»."},
{l:4,t:"טווח ארוך והרשת הסמנטית",s:"סיכום",q:"מה מכיל הזיכרון הסמנטי, לפי הסיכום?",o:["עובדות ואמיתות כלליות: מידע מופשט על העולם","תבניות ביצוע של מיומנויות מוטוריות, כמו רכיבה על אופניים","אותות היקפיים מהסביבה, שאיננו מודעים אליהם","רשמים גולמיים מהחושים, לפני שקיבלו משמעות","עד תשעה גושי מידע, למשך כמה שניות בלבד"],c:0,e:"הזיכרון הסמנטי מכיל עובדות ואמיתות כלליות, מידע מופשט וכללי על העולם, והוא מבוסס על משמעויות. המושגים קשורים למשמעויות שלהם וזה לזה בקשרים סמנטיים, ולכן הזיכרון בנוי כרשת של משמעויות."},
{l:4,t:"טווח ארוך והרשת הסמנטית",s:"יישום",q:"בעיני נועה «מרצדס» פירושו יוקרה, ובעיני אביה «מרצדס» פירושו מיושן. איזה סוג משמעות ברשת הסמנטית מודגם כאן?",o:["משמעות אמפירית, שנכונה באותה מידה לכל אדם","משמעות אסוציאטיבית, שתלויה ברקע של האדם","משמעות פרוצדורלית, שמבוססת על סדר של פעולות","משמעות סימטרית, שפועלת בשני הכיוונים","משמעות תת ספית, שהצרכן אינו מודע לקיומה"],c:1,e:"המשמעויות בזיכרון הסמנטי יכולות להיות עובדות אמפיריות או לוגיות («מרצדס = מכונית»), אבל גם משמעויות אסוציאטיביות וסובייקטיביות, שתלויות ברקע של האדם, למשל הרקע התרבותי."},
{l:4,t:"טווח ארוך והרשת הסמנטית",s:"סיכום",q:"מתי עולה ערך המותג, לפי הסיכום על הרשת הסמנטית?",o:["כשהמותג מקושר למעט משמעויות ככל האפשר, כדי למנוע בלבול","כשהמשמעויות של המותג דומות ככל האפשר לאלה של המתחרים","כשהצרכן פוגש את המותג רק דרך הזיכרון לטווח קצר","כשהקשר בין המותג לערך פועל בכיוון אחד בלבד","כשהנתיבים חזקים, והמשמעויות ייחודיות ורלוונטיות"],c:4,e:"ערך המותג עולה ככל שהנתיבים ברשת חזקים יותר: הצרכן נזכר במותג בקלות, ואסוציאציות חיוביות מתעוררות מהר. הוא עולה גם ככל שהמשמעויות ייחודיות יותר ביחס למתחרים, והן צריכות להיות רלוונטיות לצרכים ולערכים של הצרכן."},
{l:4,t:"טווח ארוך והרשת הסמנטית",s:"סיכום",q:"מהי צפיפות הקשרים ברשת הסמנטית?",o:["המידה שבה מחשבה על הערך מובילה בחזרה אל המותג","עוצמת האמונה של הצרכן בקשר מסוים","מספר המשמעויות שמקושרות למושג","המידה שבה המותג דומה למושגים אחרים ברשת","מספר גושי המידע שאפשר לזכור בו בזמן"],c:2,e:"צפיפות הקשרים: מושג שיש לו יותר משמעויות, למשל יותר ערכים למותג. זה תורם הן למודעות למותג והן לערך המותג עבור הצרכן. עוצמת האמונה היא חוזק הקשרים, והכיוון ההפוך הוא סימטריה."},
{l:4,t:"טווח ארוך והרשת הסמנטית",s:"סיכום",q:"במה תלוי חוזק הקשרים ברשת הסמנטית, לפי התשובה לשאלת התרגול שבסיכום?",o:["במספר גושי המידע שיש במסר הפרסומי","במידת המעורבות של הצרכן ברגע הקנייה","בדמיון של המותג למותגים המתחרים בקטגוריה","בחזרה על אותה זהות בדרכים שונות","בקישור המותג לכמה שיותר ערכים חדשים"],c:3,e:"חוזק הקשרים פירושו אמונות חזקות. הוא תלוי בחזרה על אותה זהות (אותה אסוציאציה, אותו ערך) בדרכים שונות, ולא בקישור לערכים נוספים. קישור לערכים נוספים תורם לצפיפות."},
{l:4,t:"טווח ארוך והרשת הסמנטית",s:"יישום",q:"מותג קפה שמזוהה עם איכות ועם עיצוב מתחיל להיות מזוהה גם עם קיימות. מה קורה בהכרח לרשת הסמנטית שלו, לפי הסיכום?",o:["הקשר בין המותג לאיכות נחלש, בגלל חסימה לאחור","הדמיון למתחרים גדל, ולכן הבידול של המותג נפגע","חוזק הקשרים גדל, אבל צפיפות הרשת נשארת כפי שהייתה","הקשרים הופכים לסימטריים, כי נוסף להם ערך שלישי","הצפיפות גדלה, אבל חוזק הקשרים והדמיון לא בהכרח"],c:4,e:"זו שאלת התרגול על נספרסו שבסיכום: קישור המותג ליותר אסוציאציות וערכים תורם בהכרח לצפיפות הרשת. הוא לא תורם בהכרח לחוזק הקשרים, שתלוי בחזרה על אותה זהות, וגם לא לדמיון, שתלוי בזהות האסוציאציות שנבחרו: הן יכולות להגדיל את הדמיון או להקטין אותו."},
{l:4,t:"טווח ארוך והרשת הסמנטית",s:"יישום",q:"מותג חוזר במשך שנים, בכל ערוץ ובכל קמפיין, על אותה הבטחה אחת. איזו תכונה של הרשת הסמנטית הוא מחזק בעיקר?",o:["סימטריה","צפיפות הקשרים","חוזק הקשרים","קיבולת הזיכרון","דמיון למתחרים"],c:2,e:"חוזק הקשרים תלוי בחזרה על אותה זהות, אותה אסוציאציה ואותו ערך, בדרכים שונות. הוספה של ערכים חדשים הייתה מגדילה את הצפיפות."},
{l:4,t:"טווח ארוך והרשת הסמנטית",s:"סיכום",q:"בשקף מהמצגת: «סטימצקי» מוביל ל«ספרים», ו«ספרים» מובילים ל«סטימצקי». לעומת זאת «סטימצקי» מוביל ל«צעצועים», אבל «צעצועים» אינם מובילים ל«סטימצקי». מה מודגם כאן?",o:["קשר סימטרי מול קשר לא סימטרי","משמעות אמפירית מול משמעות סובייקטיבית","קשר צפוף מול קשר דליל","זיכרון מפורש מול זיכרון מרומז","חסימה לפנים מול חסימה לאחור"],c:0,e:"סימטריה: האם מחשבה על המותג מובילה לערך, וגם להפך, מחשבה על הערך מובילה לזכירת המותג. הקשר עם «ספרים» סימטרי, והקשר עם «צעצועים» פועל בכיוון אחד בלבד."},
{l:4,t:"טווח ארוך והרשת הסמנטית",s:"סיכום",q:"מתי נרצה דמיון גבוה בין המותג למושגים אחרים ברשת, ומתי דמיון נמוך, לפי הסיכום?",o:["גבוה בכל מקרה, כי דמיון מגדיל את צפיפות הרשת ואת ערך המותג","גבוה כדי ליצור הכללה, כמו ב«בית ממותג». נמוך כדי ליצור הבדלה, כמו מול מתחרים","גבוה כדי ליצור הבדלה מול המתחרים. נמוך כדי ליצור הכללה, כמו באסטרטגיית «בית ממותג»","נמוך בכל מקרה, כי דמיון גורם לחסימה לפנים ולשכחה של המותג","גבוה ב«בית של מותגים», ונמוך ב«בית ממותג» ומול המתחרים"],c:1,e:"לפעמים נרצה דמיון גבוה, כדי ליצור הכללה, למשל באסטרטגיה של «בית ממותג». לפעמים נרצה דמיון נמוך, כדי ליצור הבדלה, למשל לעומת המתחרים או באסטרטגיה של «בית של מותגים»."},
{l:4,t:"טווח ארוך והרשת הסמנטית",s:"יישום",q:"חברה משיקה מוצר חדש תחת שם המותג הקיים שלה ובאותה שפה עיצובית, כדי שהתפיסות על המותג יעברו גם אליו. על מה היא נשענת?",o:["על חסימה לאחור, כדי שהמוצר החדש ידחק את הישן","על מגבלת הקיבולת של הזיכרון לטווח קצר","על דמיון נמוך בין המושגים, כדי ליצור הבדלה","על דמיון גבוה בין המושגים, כדי ליצור הכללה","על קשר לא סימטרי בין המוצר החדש לבין המותג"],c:3,e:"דמיון גבוה בין הגירוי, המוצר או המותג לבין גירויים אחרים יוצר הכללה. זה ההיגיון של אסטרטגיית «בית ממותג»."},

{l:4,t:"חסימה ושכחה",s:"סיכום",q:"מהי חסימה לאחור?",o:["קושי לקלוט גירוי שעוצמתו מתחת לסף המוחלט","מידע חדש דוחק מידע ישן, שקשה להיזכר בו","קושי לזכור מידע חדש בגלל ידע קודם","שכחה בזיכרון לטווח קצר בגלל הזמן שחלף","פריט חדש תופס מקום של פריט בזיכרון לטווח קצר"],c:1,e:"חסימה לאחור: מידע חדש דוחק מידע ישן. הדוגמה בסיכום: «וולט» דומיננטית כל כך, שאחרי ההיכרות איתה קשה להיזכר ב«תן ביס». חסימה לפנים היא ההפך: ידע קודם מקשה לזכור מידע חדש."},
{l:4,t:"חסימה ושכחה",s:"יישום",q:"לקוחה ותיקה של רשת פארם מתקשה לזכור שהרשת שינתה את שמה, ואת המידע שפורסם על השינוי, כי הרשת במתכונתה הישנה מושרשת אצלה. איזה תהליך מתואר?",o:["חסימה לאחור","התקה","התרמה","דעיכה","חסימה לפנים"],c:4,e:"חסימה לפנים: קושי לזכור מידע חדש בגלל ידע קודם. זו דוגמת ניו פארם ו-be שבסיכום: המתכונת הוותיקה מושרשת, ולכן קשה לזכור את השינויים ואת השם החדש."},
{l:4,t:"חסימה ושכחה",s:"יישום",q:"רשת מזון משנה סניפים ממותג ישן למותג חדש ויוקרתי. בשלב הביניים היא מכנה את הסניפים בשם גנרי, «סופר», עד שהשיפוץ מסתיים. מה היא מנסה למנוע, לפי התשובה שבסיכום?",o:["חסימה לפנים: שהשם החדש ייקשר לסניף הישן, ויקשה לקשר אותו לזהות החדשה","התקה: שהשם החדש ידחק את השם הישן מהזיכרון לטווח קצר של הלקוחות","קשר סימטרי: שהשם הגנרי יוביל את הלקוחות בחזרה אל המותג הישן","דעיכה: שהלקוחות ישכחו את הרשת כולה בזמן שהסניפים נמצאים בשיפוץ","חסימה לאחור: שהמותג החדש והיוקרתי ישכיח מהלקוחות את המותג הישן"],c:0,e:"זו שאלת התרגול על «קרפור» שבסיכום, והתשובה שם: לא חסימה לאחור, אלא חסימה לפנים. אם השם «קרפור» יזוהה עם סניף לפני העיצוב החדש, הוא ייקשר להקשרים לא איכותיים, והידע הזה יקשה בעתיד לקשר את המותג לזהות החדשה."},
{l:4,t:"חסימה ושכחה",s:"יישום",q:"מאז שרותי התרגלה לאפליקציית תשלומים חדשה, היא מתקשה להיזכר בשם האפליקציה שבה השתמשה במשך שנים. איזה תהליך מתואר?",o:["חסימה לפנים","גירוי תת ספי","חסימה לאחור","דעיכה","התקה"],c:2,e:"חסימה לאחור: מידע חדש דוחק מידע ישן. המידע הישן נמצא בזיכרון לטווח ארוך, ולכן זו אינה התקה, ששייכת לזיכרון לטווח קצר."},
{l:4,t:"חסימה ושכחה",s:"סיכום",q:"גם בהתקה וגם בחסימה לאחור מידע חדש פוגע בזכירה של מידע קודם. מה ההבדל ביניהן, לפי הסיכום?",o:["התקה שייכת לזיכרון המרומז, וחסימה לאחור שייכת לזיכרון המפורש","אין הבדל ביניהן: אלה שני שמות לאותו תהליך של שכחה","התקה היא שכחה בזיכרון לטווח ארוך, וחסימה לאחור היא שכחה בזיכרון לטווח קצר","התקה היא שכחה בזיכרון לטווח קצר, וחסימה לאחור היא שכחה בזיכרון לטווח ארוך","התקה נגרמת מחלוף הזמן, וחסימה לאחור נגרמת מעומס של גושי מידע"],c:3,e:"שכחה בזיכרון לטווח קצר: התקה (פריט חדש תופס את מקומו של פריט ישן) או דעיכה (הזמן שחלף). שכחה בזיכרון לטווח ארוך: חסימה לאחור (מידע חדש דוחק ישן) או חסימה לפנים (ידע קודם מקשה לזכור חדש)."},

{l:4,t:"זיכרון מרומז מול מפורש",s:"מרצה",q:"אותו יין מוגש לשתי קבוצות. בקבוצה אחת הוא מוגש בכוס יוקרתית, בתאורה נעימה ולצד מוצרים יקרים; בקבוצה השנייה ההגשה פשוטה. הצרכנים בקבוצה הראשונה מעריכים את היין כאיכותי יותר, אף שהם טוענים שההגשה לא השפיעה עליהם. איזה הסבר מתאים ביותר?",o:["השפעת מסגור וזיכרון מרומז: רכיבי הסביבה משפיעים על הערך הנתפס גם ללא מודעות מלאה להשפעתם.","זיכרון מפורש בלבד, משום שהצרכנים יכולים לתאר את הכוס ואת התאורה.","חוק ובר, משום שמחיר היין לא השתנה.","התקה בזיכרון לטווח קצר.","ABM, משום שהחוויה הותאמה לקבוצה מסוימת."],c:0,e:"לפי המפתח של המרצה. מסגור: הצרכן מפרש באופן לא מודע גירויים שנחשבים חלק מהמסגרת ולא מהמוצר, כמו הרקע, האווירה והתאורה. אם נשאל את הצרכנים הם יכחישו את ההשפעה, אבל בפועל המסגרת משפיעה על הפרשנות ועל הערך שהם נותנים למוצר."},
{l:4,t:"זיכרון מרומז מול מפורש",s:"מרצה",q:"צרכן אומר: 'אני לא אוהב את המותג הזה; הוא נראה לי מיושן, ולכן כנראה לא אבחר בו'. איזה מושג מתאר בצורה הטובה ביותר את ההערכה הזאת?",o:["צורך - פער בין מצב מצוי לרצוי.","עמדה - הערכה אישית חיובית או שלילית כלפי אובייקט, המשפיעה על הנכונות להגיב כלפיו.","סף הבחנה בהבדל.","תסריט פעולה בלבד.","דרישת סף בקנייה מוסדית."],c:1,e:"לפי המפתח של המרצה. עמדה היא הערכה אישית, חיובית או שלילית, כלפי אובייקט, והיא משפיעה על הנכונות להגיב כלפיו. בסיכום על הזיכרון המרומז: לצרכנים עמדות שונות על מוצרים ומותגים, ורובן אינן מודעות (גישות מוטבעות)."},
{l:4,t:"זיכרון מרומז מול מפורש",s:"סיכום",q:"איך כהנמן מבחין בין שתי מערכות החשיבה, לפי הסיכום?",o:["הטייס האוטומטי הוא הזיכרון המפורש (מערכת 1), והלא אוטומטי הוא המרומז (מערכת 2)","הטייס האוטומטי פועל רק במעורבות גבוהה, והלא אוטומטי רק במעורבות נמוכה","הטייס האוטומטי הוא הזיכרון לטווח קצר, והלא אוטומטי הוא הזיכרון לטווח ארוך","הטייס האוטומטי הוא הזיכרון המרומז (מערכת 1), והלא אוטומטי הוא המפורש (מערכת 2)","שתי המערכות מודעות, אבל רק אחת מהן משתתפת בהחלטות של קנייה"],c:3,e:"כהנמן: הטייס האוטומטי הוא הזיכרון המרומז (סיסטם 1), והטייס הלא אוטומטי הוא הזיכרון המפורש (סיסטם 2). שתי המערכות מעורבות בכל החלטה שאנו מקבלים."},
{l:4,t:"זיכרון מרומז מול מפורש",s:"סיכום",q:"איזה תיאור מתאים למערכת עיבוד המידע המרומזת, לפי הסיכום?",o:["קולטת חמישה עד תשעה גושי מידע, באופן מודע וביקורתי","מכילה רק מידע עובדתי, כמו שמות ותאריכים","שומרת מידע כ-15 עד 30 שניות, ואז המידע דועך","דורשת מאמץ מנטלי, ופועלת רק כשמפנים אליה קשב","פועלת באופן אוטומטי, אסוציאטיבי ולא מודע, ללא מאמץ"],c:4,e:"המידע המרומז נקלט בצורה אוטומטית, אסוציאטיבית, לא מודעת וללא מאמץ. הודות לקיבולת העצומה שלו, הטייס האוטומטי מעבד כמעט את כל האותות בסביבה, ולכן גם אותות היקפיים וקלושים עשויים להשפיע על ההחלטות. חמישה עד תשעה גושים, באופן מודע וביקורתי, הם המערכת המפורשת."},
{l:4,t:"זיכרון מרומז מול מפורש",s:"סיכום",q:"מה מלמדים חולי אמנזיה על הזיכרון, לפי הסיכום?",o:["שיש שתי מערכות: עובדות נשכחות, וכישורים מוטוריים נלמדים","שכישורים מוטוריים נשמרים בזיכרון המפורש, ועובדות נשמרות בזיכרון המרומז","שאין זיכרון בלי קשב: מי שאינו זוכר עובדות אינו לומד דבר","שהזיכרון לטווח קצר והזיכרון לטווח ארוך הם מערכת אחת","שהזיכרון המרומז נפגע תמיד לפני הזיכרון המפורש"],c:0,e:"ההוכחה לשתי מערכות של זיכרון ממוחשת בעיקר אצל הלוקים באמנזיה: הם שוכחים פרטים מעברם ואינם מסוגלים לזכור מידע חדש, אבל מסוגלים ללמוד ולזכור כישורים מוטוריים ותפיסתיים."},
{l:4,t:"זיכרון מרומז מול מפורש",s:"סיכום",q:"מה מצא המחקר של קנינג על חשיפה למותג חזק, כמו קוקה קולה?",o:["ההשפעה נמצאה בעיקר אצל מותגים חלשים, שהצרכנים אינם מכירים","הרגש התעורר, החשיבה הרציונלית הצטמצמה, והצרכנים הכחישו","שם המותג השפיע רק על צרכנים שהיו מודעים להשפעה שלו עליהם","הצרכנים דיווחו שהמותג השפיע עליהם, אבל במוח לא נמדד שום שינוי","החשיבה הרציונלית גברה, והצרכנים השוו את התכונות ביתר קפידה"],c:1,e:"בחשיפה למותג חזק חלו במוח תהליכים שעוררו יותר את הרגש, וצמצמו את האזורים שאחראים לחשיבה רציונלית ולהחלטות מורכבות. הצרכנים הכחישו שהמיתוג השפיע עליהם. קנינג מצא שההשפעה רלוונטית בעיקר למותגים החזקים."},
{l:4,t:"זיכרון מרומז מול מפורש",s:"סיכום",q:"מהי «אשליית האמת», שהזיכרון המרומז מוביל אליה?",o:["הנטייה להעריך הנחה לפי הספרה השמאלית במחיר","הנטייה להשלים מידע חסר לתבנית אחת שלמה","הנטייה להאמין יותר להצהרות שכבר שמענו","הנטייה לראות תנועה בין שני הבזקי אור נפרדים","הנטייה לשים לב רק למידע שמחזק עמדה קודמת"],c:2,e:"הזיכרון המרומז מוביל להטיות תפיסתיות ולאפקט של «אשליית אמת»: אנו נוטים להאמין יותר להצהרות שכבר שמענו. תשומת לב רק למידע שמחזק עמדה קודמת היא חשיפה סלקטיבית."},
{l:4,t:"זיכרון מרומז מול מפורש",s:"יישום",q:"מאמר שנזכר בסיכום בדק אם שיח של צרכנים ברשתות החברתיות, שתומך במוצרים אורגניים, מעלה את ההעדפה למוצרים כאלה בלי שהצרכנים מודעים לכך. באיזה עיקרון של הזיכרון המרומז מדובר?",o:["חסימה לאחור","התקה","אינרציה","סגירות (השלמה)","התרמה"],c:4,e:"התרמה היא תהליך שבו האדם אינו מודע לכך שהוכוון להתמקד בהיבטים מסוימים של הגירוי. המאמר בוחן שימוש בתוכן שהצרכנים עצמם יוצרים, כדי ליצור התרמה שמעודדת צריכה של מוצרים אורגניים."},
{l:4,t:"זיכרון מרומז מול מפורש",s:"סיכום",q:"מהו מסגור, לפי הסיכום על הזיכרון המרומז?",o:["השפעה לא מודעת של מה שסביב המוצר, כמו תאורה, ריח ומיתוג, על הערך שלו","ארגון המידע על המוצר בגושים מעטים, כדי שיהיה קל לזכור אותו לאורך זמן","הצגה מודעת ומפורשת של יתרונות המוצר, בתוך מסגרת זמן מוגבלת של מבצע","קביעת מחיר שמסתיים בספרות 99, כדי שהמוצר ייראה זול יותר לצרכן","הבלטת המוצר כדמות מרכזית, כך שכל שאר המידע שסביבו הופך לרקע"],c:0,e:"הצרכן מפרש באופן לא מודע גירויים בסביבה השיווקית של המוצר, שנחשבים חלק מהמסגרת ולא מהמוצר עצמו: הרקע, האווירה, סידור החנות, התאורה, הריח, המוזיקה, המיתוג והצבעים. גם מותגים הם מסגרות."},
{l:4,t:"זיכרון מרומז מול מפורש",s:"סיכום",q:"מדוע סקר שבו שואלים צרכנים ישירות מה השפיע על הבחירה שלהם אינו חושף את השפעת המסגרת, לפי הסיכום?",o:["כי המסגרת משפיעה רק על צרכנים במעורבות גבוהה, שאינם משתתפים בסקרים","כי הצרכנים מודעים להשפעה, אבל מתביישים להודות בה בפני מי שעורך את הסקר","כי הצרכנים אינם מודעים להשפעה, ולכן אינם מייחסים לה משקל בשיקולים שלהם","כי השפעת המסגרת קיימת רק בחנויות פיזיות, ואילו הסקרים נערכים ברשת","כי המסגרת משפיעה על הזיכרון לטווח קצר, והצרכנים שוכחים אותה עד הסקר"],c:2,e:"הצרכנים אינם מודעים בהכרח להשפעת המסגרת, ולכן במחקרי תשאול עצמי הם אינם נוטים לייחס להיבטים האלה חלק בשיקולי קבלת ההחלטות שלהם. אם נשאל אותם, הם יכחישו את ההשפעה."},
{l:4,t:"זיכרון מרומז מול מפורש",s:"יישום",q:"במחקר הפודינג שנזכר בסיכום, צבע הפודינג השפיע על האופן שבו נתפס הטעם שלו. מה הממצא מדגים?",o:["סף ההבחנה בהבדל: שינוי בצבע חייב להיות גדול מספיק כדי שיורגש בטעם","ציפיות מוטמעות: ידע קודם יוצר ציפיות, ומשפיע על הפרשנות","חסימה לפנים: הצבע המוכר מקשה על הצרכן לזכור את הטעם החדש","אינרציה: הצרכנים בוחרים שוב ושוב את הצבע שהם רגילים לקנות","קשב לא רצוני: צבע בולט מושך את תשומת הלב אל המוצר שעל המדף"],c:1,e:"חלק מהפרשנות של הגירוי קשור למידע שכבר קיים אצל הצרכנים, לא בהכרח מודע, והוא יוצר ציפיות לביצועי המוצר. אלה תהליכי Top-Down בפרשנות: היא תלויה לא רק בגירוי עצמו, אלא גם בציפיות ובידע קודם. ידע קודם יוצר גם חשיפה סלקטיבית."},
{l:4,t:"זיכרון מרומז מול מפורש",s:"יישום",q:"יצרן של תחליף בשר חושד שהצרכנים תופסים את המוצר כלא טעים, בלי שהם מודעים לכך. איזו דרך מחקר ממליץ הסיכום כדי לחשוף תפיסה כזאת?",o:["שאלון של מעורבות אישית, שבו מחצית מהפריטים הפוכים","בדיקה של סף ההבחנה בהבדל, בין המוצר לבין בשר רגיל","מדידה של זמני השינון, כדי לבדוק את הזיכרון לטווח קצר של הצרכנים","מחקרי עומק: מחקרי השלכה, תצפיות, נוירו מרקטינג ומדידה משותפת","סקר ישיר, שבו שואלים את הצרכנים מה דעתם על הטעם של המוצר"],c:3,e:"רוב העמדות והתפיסות אינן מודעות (גישות מוטבעות), ולכן לא מספיקים מחקרי תשאול ישירים. צריך מחקרי עומק ושיטות שמתחקות אחר השפעות לא מודעות: מחקרי השלכה, תצפיות אנושיות, מחקרי נוירו מרקטינג וניסויים של מדידה משותפת (conjoint), שבהם הצרכנים אינם נדרשים להסביר את הבחירות."},
{l:4,t:"זיכרון מרומז מול מפורש",s:"סיכום",q:"מה קורה בזמן החלטת רכישה, לפי עקרון העונג והסבל?",o:["העונג והסבל מבטלים זה את זה, ולכן ההחלטה מתקבלת בסוף לפי המחיר בלבד","העונג משפיע רק על קניות במעורבות נמוכה, והסבל רק על קניות במעורבות גבוהה","קודם מתרחש תהליך של סבל מהעלות, ורק אחרי התשלום מתחיל תהליך של עונג","עונג מהתועלת וסבל מהעלות פועלים במקביל, והתועלת הנתפסת צריכה לגבור","הצרכן מודע לשני התהליכים, ומחשב אותם בקפידה על פי נתונים עובדתיים"],c:3,e:"באופן לא מודע מתרחשים במקביל שני תהליכים: עונג מהציפייה למוצר ולתועלות שבו, וסבל מהעלות המצופה. אם תפיסת התועלת עולה על תפיסת העלות, יתבצע תהליך החליפין. לכן מטרת המשווקת היא להעצים את העונג ולהפחית את תפיסת הכאב."},
{l:4,t:"זיכרון מרומז מול מפורש",s:"יישום",q:"במחקר על הספרה השמאלית הוצגה אותה הנחה בדיוק על צנצנת ריבה, בשתי צורות: מ-4.01 ל-3.00 דולר, ומ-4.00 ל-2.99 דולר. מה נמצא?",o:["ההנחה נתפסה כגדולה יותר בירידה מ-4.00 ל-2.99, בגלל הספרה השמאלית","ההנחה נתפסה כגדולה יותר בירידה מ-4.01 ל-3.00, כי המחיר הסופי עגול","ההנחה לא נתפסה בכלל, כי היא קטנה מסף ההבחנה בהבדל","ההנחה נתפסה רק אצל צרכנים שחישבו את הפער במדויק","ההנחה נתפסה כשווה בשני המקרים, כי פער המחירים זהה לחלוטין"],c:0,e:"לספרה השמאלית בהצגת המחיר יש השפעה תפיסתית חזקה יותר מלספרה הימנית. בירידה מ-4.00 ל-2.99 הספרה השמאלית יורדת מ-4 ל-2, ולכן תפיסת ההנחה גדולה יותר, אף שפער המחירים זהה."},
{l:4,t:"זיכרון מרומז מול מפורש",s:"יישום",q:"חברה מציגה ליד המוצר שלה גרסה יקרה במיוחד שלו, אף שאינה מצפה למכור ממנה הרבה. מה המטרה, לפי הסיכום?",o:["להעלות את המעורבות, כדי שהצרכן ישקיע יותר בחיפוש מידע","להתגבר על מגבלת הקיבולת של הזיכרון לטווח קצר","להקטין את העלות הנתפסת של המוצר הרגיל, בלי הנחה","ליצור קשר סימטרי בין שם המותג לבין ערך היוקרה והאיכות","להסיט את הקשב מהמוצר הרגיל אל הגרסה היקרה"],c:2,e:"הקטנת תפיסת העלות יכולה להתבסס גם על השפעות מרומזות: גירויים שיוצרים פרשנות של הוזלה, כמו עיצוב המחיר, והמסגרת וההקשר שלו, למשל מחירי המוצרים שמוצגים לידו. בתשובה לשאלת הסיכום: הצגת גרסה יקרה במיוחד גורמת למחיר המקורי להיתפס כיותר כלכלי."},
{l:4,t:"זיכרון מרומז מול מפורש",s:"יישום",q:"רשת פארם מציבה בסניף רובוט, שמברך את הלקוחות ומוביל אותם למדף שהם מחפשים. לפי התשובה שבסיכום, איך המהלך מקשר את הרשת לערך החדשנות?",o:["בשום אופן, כי רובוט הוא שירות ללקוח, ולא ערך שמקושר למותג","גם במפורש, בשימוש בטכנולוגיה, וגם במרומז, כאמירה עקיפה","רק באופן מפורש, כי הלקוח רואה את הטכנולוגיה ומשתמש בה בעצמו","רק באופן מרומז, כי הלקוח אינו מודע לכך שהרובוט משפיע עליו","רק דרך הזיכרון לטווח קצר, עד שהלקוח יוצא מהסניף"],c:1,e:"זו שאלת התרגול על סופר-פארם שבסיכום, והתשובה שם: נכון, גם וגם. הטכנולוגיה היא תהליך מפורש, שמשלב את הצרכן בחדשנות. בעצם הוספת הרובוט יש גם גימיק ואמירה עקיפה, שממצבת את הרשת כחדשנית."},
{l:4,t:"זיכרון מרומז מול מפורש",s:"סיכום",q:"מתי, לפי סיכום הפרקים על תפיסה וזיכרון, פנייה לזיכרון המרומז מתאימה במיוחד?",o:["כשרוצים שהצרכן יזכור מספרים מדויקים, כמו מחיר או תכולה","רק כשהצרכן במעורבות גבוהה, ומחפש מידע באופן פעיל","רק כשאין למשווקים שום מידע עובדתי ומוכח על המוצר שלהם","כשהמסר מיועד ללקוחות עסקיים, ולא לצרכנים פרטיים","כשרוצים למנוע חשיבה ביקורתית, או לחזק מסר עובדתי"],c:4,e:"תהליכים מרומזים רלוונטיים כשהמשווקים רוצים למנוע חשיבה ביקורתית, למשל מיצוב מזון כטבעי בעזרת סמלים, מילים וצבעים, ולא עובדות. אבל גם כשיש מידע עובדתי מוכח, אפשר לחזק את התפיסות בפנייה לזיכרון המרומז: דמויות, צבעים, ושיח ברשתות שיוצר התרמה."},

{l:4,t:"תסריט פעולה ודחיפה קלה",s:"סיכום",q:"מה נכון לגבי זיכרון מסוג תסריט פעולה?",o:["הוא נלמד תמיד באופן לא מודע, ולכן המשווקים אינם יכולים להשפיע עליו","הוא פועל רק כשהצרכן מפנה קשב רצוני אל הפעולה","הוא מוגבל לחמישה עד תשעה צעדים בכל פעולה שנלמדה","הוא מקודד מידע לפי משמעות, ומכיל עובדות כלליות על העולם","הוא מקודד מידע לפי אופן הביצוע של פעולות, ואינו דורש מאמץ"],c:4,e:"תסריט פעולה מקדד מידע לפי ה«איך»: תבניות ביצוע של מיומנויות חשיבתיות ומוטוריות. הוא אינו מצריך מאמץ קוגניטיבי, ויכול להתבסס על פעולות אוטומטיות, גם אם במקור הפעולה נלמדה באופן מודע, כמו רכיבה על אופניים."},
{l:4,t:"תסריט פעולה ודחיפה קלה",s:"סיכום",q:"איך הגדירו ת'אלר וסונשטיין «דחיפה קלה» (Nudge)?",o:["איסור על האפשרויות הלא רצויות, כך שלצרכן נשארת רק הבחירה שנחשבת נכונה","שינוי קטן במוצר עצמו, שנמצא מתחת לסף ההבחנה בהבדל של הצרכן","התערבות קלה שמשנה התנהגות באופן צפוי, בלי לאסור אפשרויות ובלי לשנות מאוד תמריצים","תמריץ כלכלי משמעותי, שמכוון את הצרכן לבחור דווקא באפשרות שרצויה למשווק ולא באחרת","מסר פרסומי בעוצמה גבוהה מהרגיל, שמושך קשב לא רצוני אל המוצר"],c:2,e:"ההגדרה: «התערבות קלה, המשנה את אופן התנהגותם של אנשים, באופן צפוי, מבלי לאסור עליהם אפשרויות או לשנות משמעותית את התמריצים הכלכליים הניתנים להם»."},
{l:4,t:"תסריט פעולה ודחיפה קלה",s:"יישום",q:"במדינות שבהן ההגה בצד שמאל, לקוחות נוטים לפנות ימינה כשהם משוטטים בחנות. רשת ממקמת בצד ימין את המחלקות שהיא רוצה לקדם. על מה מבוסס המהלך?",o:["על חוק הקרבה, כי המחלקות שבצד ימין סמוכות זו לזו","על זיכרון סמנטי, כי הצד הימני מקושר למשמעות חיובית","על קשב לא רצוני, כי המחלקות שבצד ימין בולטות יותר","על דחיפה קלה, שמנצלת תבנית פעולה אוטומטית של הלקוחות","על חסימה לפנים, כי הלקוחות זוכרים את הסידור הקודם"],c:3,e:"הצרכנים מבצעים פעולות רבות באופן אוטומטי, לפי תסריט פעולה. המשווקים משתמשים בכך כדי להשפיע על בחירות, בתכנון מסלולי הולכה וסידור מדפים. הכוונה קלה כזאת היא «אמנות הדחיפה הקלה». דוגמה נוספת: מוצרי עוגן בקצות מעברים ארוכים."},
{l:4,t:"תסריט פעולה ודחיפה קלה",s:"יישום",q:"איזו מהבאות היא דוגמה להכוונה מרומזת של צרכנים, ולא להכוונה מפורשת, לפי הסיכום?",o:["אזהרה שמודפסת על קופסת סיגריות","חיתוך העוגות בבר קינוחים לפרוסות קטנות יותר","פרסום של מספר הקלוריות על האריזה","שלט בכניסה למזנון, שמבקש מהלקוחות לבחור בפירות","עלון שמסביר ללקוחות את היתרונות של אכילה בריאה"],c:1,e:"הכוונה מפורשת: אזהרה על קופסת סיגריות, פרסום קלוריות על אריזה. הכוונה מרומזת משתמשת בתבניות פעולה ובטייס האוטומטי: מרצפות קטנות שמאיטות את קצב ההליכה, או חיתוך העוגות לפרוסות קטנות, שמשאיר בצלחת מקום גם לפירות."},
]);
