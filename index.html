{l:5,t:"מעורבות: הגדרה והשפעה",s:"סיכום",q:"מהי מעורבות הצרכנים, לפי הסיכום?",o:["רמת הנגיעה האישית שהפרט מייחס למוצר או להתנהגות מסוימת","הערכה חיובית או שלילית של הצרכן כלפי מותג מסוים","הפער שהצרכן תופס בין המצב המצוי לבין המצב הרצוי","הנטייה של הצרכן לחזור על אותה קנייה מתוך הרגל","מספר החלופות שהצרכן מוכן לשקול לפני הקנייה"],c:0,e:"מעורבות מגדירה את רמת הנגיעה האישית שהפרט מייחס למוצר או להתנהגות מסוימת: מידת החשיבות והרלוונטיות של קניית המוצר עבורו. לפיה נקבעת נכונותו להשקיע זמן ומאמץ בכל שלב."},
{l:5,t:"מעורבות: הגדרה והשפעה",s:"סיכום",q:"איזה סוג משתנה היא המעורבות, לפי הסיכום?",o:["משתנה דיכוטומי: מעורבות קיימת או אינה קיימת","משתנה רציף, ממעורבות נמוכה לגבוהה","משתנה שמתאר את המוצר בלבד, ולא את הצרכן","משתנה קבוע לכל צרכן, שאינו תלוי במוצר","משתנה שנמדד בפריט יחיד, לפי מחיר המוצר"],c:1,e:"המעורבות היא משתנה רציף, שנע ממעורבות נמוכה למעורבות גבוהה. זו עוצמה, שבודקת כמה הנושא חשוב ורלוונטי לצרכן, והיא נמדדת במשתנה רב פריט."},
{l:5,t:"מעורבות: הגדרה והשפעה",s:"סיכום",q:"איך מודדים מעורבות, לפי הסיכום?",o:["לפי מחיר המוצר בלבד: ככל שהמוצר יקר יותר, כך המעורבות בו גבוהה יותר","בשאלה ישירה אחת, שבה הצרכן מדרג עד כמה המוצר חשוב לו, מאחת עד עשר","בספירה של מספר החנויות והאתרים שהצרכן ביקר בהם לפני הקנייה","במדידה של הפעילות המוחית של הצרכן בזמן חשיפה לשם המותג","בסולם המעורבות האישית של זייקובסקי, שהוא משתנה רב פריט"],c:4,e:"המדידה נעשית במשתנה רב פריט, בסולם המעורבות האישית שפיתחה ג'ודי זייקובסקי. מחצית מהפריטים מסומנים בכוכבית: בהם הופכים את התשובה, ורק אז מחשבים ממוצע."},
{l:5,t:"מעורבות: הגדרה והשפעה",s:"סיכום",q:"איך מתואר מקומה של המעורבות בתהליך התנהגות הצרכנים, לפי הסיכום?",o:["מושג מתווך, שפועל רק בין חיפוש המידע לבין ההחלטה","שלב נפרד בתהליך, שבא אחרי ההערכה שלאחר הקנייה","תוצאה של התהליך, שנמדדת רק אחרי הרכישה","משתנה מתערב, שמשפיע לאורך כל השלבים","גורם שמשפיע רק על השלב של ההכרה בצורך"],c:3,e:"מעורבות הצרכנים אינה עוד מושג מתווך בתהליך, אלא משתנה מתערב, שמשפיע לאורך כל השלבים, אחרי שלב ההכרה בצורך."},
{l:5,t:"מעורבות: הגדרה והשפעה",s:"סיכום",q:"מה מאפיין את התנהגות הצרכן במעורבות גבוהה, לפי השקף?",o:["חיפוש מעמיק של מידע, הערכה מקיפה של חלופות, והערכה מקיפה אחרי הרכישה","חיפוש מינימלי של מידע, הערכה מהירה של חלופות, והערכה מינימלית אחרי הרכישה","חיפוש מינימלי של מידע, אבל הערכה מקיפה של המוצר אחרי הרכישה","דילוג על חיפוש המידע, והחלטה שמתקבלת מול המדף בנקודת המכירה","חיפוש מעמיק של מידע, הערכה מהירה של חלופות, ובלי שום הערכה אחרי הרכישה"],c:0,e:"במעורבות גבוהה: חיפוש מעמיק של מידע על חלופות, הערכה מקיפה של החלופות, והערכה מקיפה אחרי הרכישה. במעורבות נמוכה: חיפוש מינימלי, הערכה מהירה, והערכה מינימלית אחרי הרכישה."},
{l:5,t:"מעורבות: הגדרה והשפעה",s:"סיכום",q:"למה, לפי הסיכום, השלב של ההערכה אחרי הרכישה משמעותי יותר ככל שהמעורבות גבוהה יותר?",o:["כי במעורבות גבוהה ההחלטה מתקבלת רק בנקודת המכירה","כי הצרכן חוזר על הקנייה מתוך הרגל, ובודק אותה שוב","כי יש בו לבטים, ופוטנציאל גבוה יותר לדיסוננס","כי במעורבות גבוהה הצרכן אינו מחפש מידע לפני הקנייה","כי המוצר נמצא בשימוש זמן קצר, ולכן נבחן מהר"],c:2,e:"ככל שמעורבות הצרכנים גבוהה יותר, שלב ההערכה שלאחר הרכישה משמעותי יותר, מערב לבטים, ויש בו פוטנציאל גבוה יותר לדיסוננס."},
{l:5,t:"מעורבות: הגדרה והשפעה",s:"סיכום",q:"מה נכון לגבי העמדה שמתגבשת לפני קנייה במעורבות גבוהה, לפי הסיכום?",o:["היא מתגבשת רק בנקודת הרכישה עצמה, מול המדף","היא אינה קשורה להתנהגות, כי ההחלטה מתקבלת מתוך הרגל","היא רופפת, ולכן הצרכן מושפע מאוד ממבצעים של המתחרים","היא יציבה רק כשהמוצר זול, והסיכון שכרוך בו נמוך","היא יציבה מאוד, ויש מתאם גבוה בינה לבין ההתנהגות בנקודת הרכישה"],c:4,e:"במעורבות גבוהה התהליך מקיף ונעשה מראש. לכן העמדה שמתגבשת לפני הקנייה יציבה מאוד, ויש מתאם גבוה בינה לבין התנהגות הצרכן בנקודת הרכישה."},
{l:5,t:"מעורבות: הגדרה והשפעה",s:"יישום",q:"עומר חקר במשך חודש מחשבים ניידים, והחליט על דגם מסוים. בחנות הוא רואה מבצע על דגם מתחרה, שמוצב בבולטות ליד הכניסה. מה צפוי לפי הסיכום?",o:["הוא יקנה את שני הדגמים, כדי להקטין את הסיכון שבבחירה","הוא יושפע פחות מהמבצע, כי החליט מראש באופן מקיף","הוא יבחר לפי המיקום על המדף, כי זו קנייה מתוך הרגל","הוא ידחה את הקנייה, כי המבצע יוצר אצלו חסימה לפנים","הוא יעבור לדגם שבמבצע, כי ההחלטה מתקבלת בנקודת הרכישה"],c:1,e:"במעורבות גבוהה הצרכן מושפע פחות מגירויים בנקודת הרכישה, כמו נגישות על המדף, מבצעים של המתחרים ושינויי מחירים. החלטתו התבססה מראש על מכלול שיקולים מהותיים, בנושא שחשוב לו וכרוך בסיכונים."},
{l:5,t:"מעורבות: הגדרה והשפעה",s:"סיכום",q:"מה נכון לגבי קבלת החלטות במעורבות נמוכה, לפי הסיכום?",o:["התהליך מקיף, ונעשה מראש לפני ההגעה לחנות","אין בה תהליך של קבלת החלטות, כי הקנייה אקראית","התהליך קצר, ויכול להתבצע בנקודת הרכישה","הצרכן אינו מושפע מגירויים בנקודת הרכישה","העמדה שמתגבשת לפני הקנייה יציבה מאוד"],c:2,e:"גם במעורבות נמוכה הצרכן עובר תהליך מסוים של קבלת החלטות, אבל התהליך קצר יותר, ויכול להתבצע גם בנקודת הרכישה עצמה."},
{l:5,t:"מעורבות: הגדרה והשפעה",s:"סיכום",q:"איך קשורה רמת המעורבות לסוג עיבוד המידע, לפי המבוא לסיכום?",o:["במעורבות גבוהה העיבוד אוטומטי ומהיר, בזיכרון המרומז. במעורבות נמוכה הוא מעמיק, בזיכרון המפורש","בשתי הרמות עיבוד המידע זהה, ורק משך הזמן של הקנייה עצמה שונה בין הרמות","במעורבות גבוהה המידע נשמר רק בטווח הקצר, ובמעורבות נמוכה הוא נשמר בטווח הארוך","במעורבות גבוהה העיבוד מעמיק, בזיכרון המפורש. במעורבות נמוכה הוא אוטומטי ומהיר, בזיכרון המרומז","אין קשר בין רמת המעורבות של הצרכן במוצר לבין האופן שבו הוא מעבד את המידע"],c:3,e:"בשלב חיפוש המידע: במעורבות גבוהה מתקיימים תהליכי עיבוד מידע מעמיקים, למשל בזיכרון המפורש. במעורבות נמוכה מתקיימים תהליכים אוטומטיים ומהירים, בזיכרון המרומז."},

{l:5,t:"הגורמים למעורבות",s:"סיכום",q:"מהם שלושת המשתנים העיקריים שמשפיעים על רמת המעורבות, לפי הסיכום?",o:["המוצר, הצרכן עצמו, וגורמי ההקשר","המותג, המתחרים שלו, וערוצי ההפצה שבהם הוא נמכר","הצורך של הצרכן, הרצון שלו, והביקוש למוצר","המחיר של המוצר, הפרסום שלו, ומיקומו על המדף","הזיכרון לטווח קצר, הזיכרון לטווח ארוך, והקשב"],c:0,e:"שלושת המשתנים העיקריים: כמה תועלות או סיכונים כרוכים במוצר מבחינת הצרכן; הצרכן עצמו, אישיותו ומשתנים דמוגרפיים; וגורמי הקשר, כמו עייפות או לחץ זמן. אפשר לציין גם גורם רביעי: התקשורת השיווקית."},
{l:5,t:"הגורמים למעורבות",s:"סיכום",q:"אילו סוגי סיכונים נזכרים בסיכום כגורם שמעלה את המעורבות במוצר?",o:["מפורשים ומרומזים, לפי סוג הזיכרון","משפטיים, רגולטוריים, אתיים וטכניים, כמו בדרישות הסף","כלכליים, חברתיים, פונקציונליים, בריאותיים, פסיכולוגיים","כלכליים בלבד, כי רק מחיר גבוה מעלה את המעורבות של הצרכן במוצר","שימושיים, רגשיים, משני חיים, ותועלת לסביבה ולחברה"],c:2,e:"הסיכונים (והתועלות) שכרוכים במוצר: כלכליים, חברתיים, פונקציונליים, בריאותיים ופסיכולוגיים. ככל שהם גדולים יותר מבחינת הצרכן, המעורבות גבוהה יותר."},
{l:5,t:"הגורמים למעורבות",s:"יישום",q:"מיכל ממהרת לאסוף את הילדים, ועוצרת לקנות מתנה יקרה. בגלל לחץ הזמן היא בוחרת כמעט בלי להשוות. איזה גורם השפיע על המעורבות שלה, ואיך?",o:["גורם ההקשר: לחץ הזמן העלה את המעורבות","גורם הצרכן: האישיות שלה העלתה את המעורבות","גורם התקשורת השיווקית: הפרסום הוריד את המעורבות","גורם ההקשר: לחץ הזמן הוריד את המעורבות","גורם המוצר: המחיר הגבוה הוריד את המעורבות"],c:3,e:"גורמי הקשר, כמו עייפות או לחץ זמן בעת הקנייה, מורידים מעורבות. המחיר הגבוה, שהוא גורם של המוצר, פועל בדרך כלל בכיוון ההפוך."},
{l:5,t:"הגורמים למעורבות",s:"יישום",q:"שני צרכנים שוקלים לקנות אותה מכונת כביסה. מצבו הכלכלי של אחד מהם פחות טוב. מה צפוי לפי הסיכום?",o:["המעורבות שלו תהיה גבוהה יותר, כי הסיכון הכלכלי גדול יותר עבורו","המעורבות שלו תהיה נמוכה יותר, כי מצב כלכלי הוא גורם של הקשר","המעורבות של שניהם תהיה זהה, כי היא תלויה במוצר בלבד","המעורבות של שניהם תלויה רק באישיות, ולא במצב הכלכלי","המעורבות שלו תהיה נמוכה יותר, כי הוא יבחר במוצר הזול בלי לבדוק"],c:0,e:"בין המשתנים הדמוגרפיים שמשפיעים על המעורבות נמצא המצב הכלכלי: אצל מי שמצבו פחות טוב הסיכון הכלכלי גובר, ולכן גם המעורבות."},
{l:5,t:"הגורמים למעורבות",s:"יישום",q:"יובל אימפולסיבי, ומחליט מהר גם על רכישות גדולות. אחותו מתנגדת לשינויים, ומתקשה להחליט אפילו על סוג הלחם. לאיזה גורם של מעורבות שייכים ההבדלים האלה?",o:["להקשר: התנאים בזמן הקנייה","למוצר: התועלות והסיכונים שכרוכים בו","לדפוס הקנייה: אינרציה או נאמנות","לתקשורת השיווקית של המותג","לצרכן עצמו: האישיות שלו"],c:4,e:"הגורם השני הוא הצרכן עצמו ואישיותו. יש צרכנים אימפולסיביים, שגם בהחלטות משמעותיות מחליטים מהר יחסית, ויש אנשים בעלי אישיות שמתנגדת לשינוי, שגם בהחלטות פשוטות מתקשים להחליט."},
{l:5,t:"הגורמים למעורבות",s:"סיכום",q:"לפי דוגמת האינטראקציה בין ההקשר למוצר שבסיכום, מה קורה כשחנות מבולגנת?",o:["בשתי החנויות המעורבות יורדת, כי בלגן מעייף את הצרכן","בחנות יוקרה המעורבות עולה עוד יותר, ובחנות שוק היא יורדת עוד יותר","הבלגן אינו משפיע, כי המעורבות תלויה במוצר בלבד","בחנות יוקרה המעורבות יורדת, ואילו בחנות שוק המעורבות דווקא עולה","בשתי החנויות המעורבות עולה, כי קשה יותר למצוא את המוצר"],c:1,e:"אינטראקציה בין הקשר למוצר: כשחנות של בגדי יוקרה מבולגנת, המעורבות עולה עוד יותר. כשחנות של שוק בגדים מבולגנת, המעורבות יורדת עוד יותר."},
{l:5,t:"הגורמים למעורבות",s:"סיכום",q:"לפי התרשים שבסיכום, איזה צירוף של מאפיינים מוביל למעורבות גבוהה?",o:["סיכון מועט, הבדלים ניכרים בין המותגים, מחיר נמוך, תקופת שימוש קצרה","סיכון רב, הבדלים ניכרים בין המותגים, מחיר גבוה, תקופת שימוש ארוכה","סיכון מועט, הבדלים זניחים בין המותגים, מחיר גבוה, תקופת שימוש קצרה","סיכון מועט, הבדלים זניחים בין המותגים, מחיר נמוך, תקופת שימוש קצרה","סיכון רב, הבדלים זניחים בין המותגים, מחיר נמוך, תקופת שימוש קצרה"],c:1,e:"מעורבות גבוהה: סיכון בטיחותי או בריאותי רב, הבדלים ניכרים בין המותגים, מחיר גבוה, תקופת שימוש או מחויבות ארוכה, מוצר בעל משמעות חברתית, ומוצר שמבטא את האישיות. מעורבות נמוכה: ההפך בכל אחד מהם."},
{l:5,t:"הגורמים למעורבות",s:"יישום",q:"צרכן שמצבו הכלכלי ירוד קונה בגד בדוכן מבולגן בשוק, ובכל זאת משקיע בבחירה זמן ומחשבה. מה הדוגמה ממחישה, לפי הסיכום?",o:["אינטראקציה משולשת: צרכן, הקשר ומוצר","קנייה חוזרת מתוך אינרציה, במעורבות נמוכה","שגורמי ההקשר חזקים בכל מקרה מהגורמים האחרים","שבלגן בחנות מעלה את המעורבות בכל מקרה, בכל סוג של חנות","שהמעורבות תלויה בסוג המוצר בלבד"],c:0,e:"זו הדוגמה שבסיכום לאינטראקציה משולשת: צרכן במצב כלכלי ירוד ינהג במעורבות גבוהה גם בחנות בשוק, אף שחנות שוק מבולגנת מורידה בדרך כלל את המעורבות."},
{l:5,t:"הגורמים למעורבות",s:"סיכום",q:"מהו הגורם הרביעי שהסיכום מציין כמשפיע על המעורבות, ומה מעמדו?",o:["התרבות של הצרכן, שקובעת את המעורבות יותר מכל גורם אחר","הנאמנות למותג, שמורידה את המעורבות של הצרכן בכל קנייה","הזיכרון המרומז, שמחליף בפועל את שלושת הגורמים הראשונים","המחיר של המוצר, שהוא הגורם החשוב ביותר מבין ארבעת הגורמים","התקשורת השיווקית, שיכולה להעלות מעורבות"],c:4,e:"אפשר לציין גורם רביעי, התקשורת השיווקית, שיכולה להעלות מעורבות. עם זאת, שלושת הגורמים הראשונים (המוצר, הצרכן וההקשר) הם העיקריים שנזכרים בספרות האקדמית."},

{l:5,t:"דפוסי קנייה (מודל עשהאל)",s:"סיכום",q:"לפי אילו שני ממדים מבחין עשהאל בין ארבעה דפוסי קנייה?",o:["סוג הזיכרון, והאם הקשב של הצרכן רצוני או לא רצוני","גיל הצרכן, והאם המוצר עונה על צורך שימושי או על צורך רגשי","רמת המחיר, והאם הקנייה נעשית בחנות פיזית או ברשת","רמת המעורבות, והאם מחליטים מחדש או חוזרים מתוך הרגל","רמת הסיכון שבקנייה, והאם הקונה הוא צרכן פרטי או לקוח עסקי"],c:3,e:"ציר אחד מבחין בין מעורבות גבוהה לנמוכה. הציר השני מבחין בין קנייה שבה הצרכנים מקבלים בכל פעם החלטה מחודשת, לפי הערכה מחודשת של החלופות, לבין קנייה שבה הם חוזרים על הקנייה הקודמת, מתוך הרגל."},
{l:5,t:"דפוסי קנייה (מודל עשהאל)",s:"סיכום",q:"איזה שיבוץ של דפוסי הקנייה במודל עשהאל נכון?",o:["מעורבות גבוהה עם קנייה חוזרת: אינרציה. מעורבות נמוכה עם קנייה חוזרת: נאמנות","מעורבות נמוכה עם החלטה מחודשת: החלטה מורכבת. מעורבות גבוהה עם קנייה חוזרת: אינרציה","מעורבות גבוהה עם קנייה חוזרת: נאמנות. מעורבות נמוכה עם קנייה חוזרת: אינרציה","מעורבות גבוהה עם החלטה מחודשת: נאמנות. מעורבות נמוכה עם קנייה חוזרת: חיפוש מגוון","מעורבות נמוכה עם החלטה מחודשת: נאמנות. מעורבות גבוהה עם החלטה מחודשת: אינרציה"],c:2,e:"המטריצה: מעורבות גבוהה עם תהליך קבלת החלטה היא קבלת החלטה מורכבת. מעורבות נמוכה עם תהליך קבלת החלטה היא קבלת החלטות מוגבלת, חיפוש מגוון. מעורבות גבוהה עם קנייה חוזרת היא נאמנות. מעורבות נמוכה עם קנייה חוזרת היא אינרציה."},
{l:5,t:"דפוסי קנייה (מודל עשהאל)",s:"יישום",q:"זוג צעיר מחפש דירה לקנייה: הם משווים שכונות, מחירים ומפרטים במשך חודשים. איזה דפוס קנייה זה, לפי מודל עשהאל?",o:["קבלת החלטה מורכבת","נאמנות","אינרציה","חיפוש מגוון","קבלת החלטות מוגבלת"],c:0,e:"קבלת החלטה מורכבת: מעורבות גבוהה, והצרכנים בוחנים מחדש את החלופות. רכישת דירה היא הדוגמה שבסיכום: יש משמעות רבה להבדלים בין החלופות, ואפשר להתרשם מהם לפני הקנייה."},
{l:5,t:"דפוסי קנייה (מודל עשהאל)",s:"יישום",q:"בכל ביקור בגלידרייה שירה בוחרת טעם אחר, ומחליטה מול הוויטרינה בתוך שניות. איזה דפוס קנייה זה, לפי מודל עשהאל?",o:["קנייה מוסדית לפי מפרט","נאמנות לגלידרייה","קבלת החלטות מוגבלת","קבלת החלטה מורכבת","אינרציה, מתוך הרגל"],c:2,e:"קבלת החלטות מוגבלת מתאימה למצבים של חיפוש מגוון: מעורבות נמוכה, יש ערך בגיוון ובהתנסות, והערכת החלופות מהירה ומתקיימת לרוב בנקודת המכירה. גלידות הן הדוגמה שבסיכום לצורך סנסורי של טעם."},
{l:5,t:"דפוסי קנייה (מודל עשהאל)",s:"יישום",q:"יוסי קונה כבר שנים אותו חלב, בלי לחשוב ובלי להשוות. לדבריו «כולם אותו דבר». איזה דפוס קנייה זה, לפי מודל עשהאל?",o:["נאמנות","חיפוש מגוון","קבלת החלטות מוגבלת","קבלת החלטה מורכבת","אינרציה"],c:4,e:"אינרציה: חזרה על הקנייה מתוך הרגל, במעורבות נמוכה, בגלל בידול מוצרי נמוך או קושי להבין את ההבדלים בין החלופות. מוצרי מזון בסיסיים כמו חלב הם הדוגמה שבסיכום. זו אינה נאמנות, כי המעורבות נמוכה."},
{l:5,t:"דפוסי קנייה (מודל עשהאל)",s:"יישום",q:"אחרי חיפוש ארוך מצאה תמר פסיכולוגית שהיא מרוצה ממנה מאוד, ומאז היא חוזרת רק אליה, כי קשה להעריך מראש מטפלת אחרת. איזה דפוס קנייה זה, לפי מודל עשהאל?",o:["קבלת החלטות מוגבלת","אינרציה","קבלת החלטה מורכבת","נאמנות","חיפוש מגוון"],c:3,e:"נאמנות: מעורבות גבוהה וקנייה חוזרת. היא מתאימה למצבים שבהם יש סיכון ואי ודאות בהחלטה חדשה, למשל בשירותים כמו ייעוץ פסיכולוגי, משפטי או טיפול יופי. אחרי החלטה ראשונה מעמיקה ותוצאה חיובית מאוד, חוזרים על אותה בחירה."},
{l:5,t:"דפוסי קנייה (מודל עשהאל)",s:"סיכום",q:"גם באינרציה וגם בנאמנות הצרכנים חוזרים על אותה קנייה. מה ההבדל ביניהן, לפי הסיכום?",o:["באינרציה הצרכן מרוצה מאוד מהמוצר ומהקשר עם הספק, ובנאמנות הוא אדיש למוצר ולספק","באינרציה המעורבות נמוכה והחזרה היא הרגל. בנאמנות המעורבות גבוהה, והחזרה נובעת מהימנעות מסיכון","אינרציה מתאימה למוצרים יקרים ולשירותים מקצועיים, ונאמנות מתאימה למוצרים זולים","אין הבדל ממשי בין השתיים: נאמנות היא השם השיווקי המקובל של אינרציה","באינרציה המעורבות גבוהה והחזרה נובעת מהימנעות מסיכון. בנאמנות המעורבות נמוכה, והחזרה היא הרגל"],c:1,e:"באינרציה חוזרים מתוך הרגל, במעורבות נמוכה, כל עוד התקבלה התוצאה הרצויה. בנאמנות ההתנהגות החוזרת אינה נובעת ממעורבות נמוכה, אלא מהימנעות מסיכון, ומהמשמעות של הקשר שנוצר עם נותני השירות או הפירמה."},
{l:5,t:"דפוסי קנייה (מודל עשהאל)",s:"סיכום",q:"מה התנאי לכך שדפוס הנאמנות יימשך, לפי הסיכום?",o:["שהמחיר של נותן השירות יישאר הנמוך בשוק","שהמעורבות של הצרכנים תרד עם הזמן","שהצרכנים יפסיקו לחפש מגוון","שלא יהיו בשוק נותני שירות אחרים","שהצרכנים ימשיכו לחוות שביעות רצון גבוהה"],c:4,e:"הצרכנים נוטים לחזור על אותה בחירה בתנאי שהם ממשיכים לחוות שביעות רצון גבוהה. הנאמנות נשענת על תוצאה חיובית, ולא על מעורבות נמוכה."},
{l:5,t:"דפוסי קנייה (מודל עשהאל)",s:"סיכום",q:"גם בקבלת החלטות מוגבלת וגם בקבלת החלטה מורכבת הצרכנים מעריכים את החלופות מחדש. מה ההבדל ביניהן, לפי הסיכום?",o:["במוגבלת הצרכן חוזר על הקנייה הקודמת, ובמורכבת הוא מחליף מותג","במוגבלת המעורבות נמוכה, והתהליך מהיר ומתקיים לרוב בנקודת המכירה","במוגבלת המעורבות גבוהה, והתהליך ארוך ונעשה מראש לפני הקנייה","במוגבלת אין שום הבדל בין החלופות, ובמורכבת יש הבדלים ניכרים","מוגבלת מתאימה לשירותים מקצועיים, ומורכבת מתאימה למוצרי מזון"],c:1,e:"בשני הדפוסים יש החלטה מחודשת. בקבלת החלטות מוגבלת המעורבות נמוכה, והערכת החלופות מהירה ומתקיימת לרוב בנקודת המכירה. בקבלת החלטה מורכבת המעורבות גבוהה, והצרכנים מקבלים מידע ומבחינים בערך של כל חלופה."},
{l:5,t:"דפוסי קנייה (מודל עשהאל)",s:"סיכום",q:"באילו קטגוריות מתאים דפוס של חיפוש מגוון, לפי הסיכום?",o:["בקטגוריות שבהן הצרכן אינו מבחין בשום הבדל בין המותגים","בקטגוריות של מוצרים יקרים במיוחד, כמו דירה או רכב","בקטגוריות של רכש מוסדי, שנעשה לפי מפרט מוגדר מראש","בקטגוריות שעונות על צורך סנסורי רגשי, כמו טעם, ריח או נראות","בקטגוריות של שירותים מקצועיים, כמו ייעוץ משפטי או פסיכולוגי"],c:3,e:"חיפוש מגוון מתאים לקטגוריות שעונות על צורך סנסורי רגשי: טעם (גלידות), ריח (אבקות כביסה) או נראות (אביזרי שיער). הצרכנים יכולים להעריך מראש את ההבדלים, ומקבלים ערך מעצם הגיוון."},
{l:5,t:"דפוסי קנייה (מודל עשהאל)",s:"יישום",q:"הילה קונה בכל פעם מרכך כביסה בריח אחר, כי היא נהנית מהגיוון. רונית קונה תמיד את אותו מרכך, כי לדעתה «כולם אותו דבר». איך מסווגים אותן במודל עשהאל?",o:["הילה: חיפוש מגוון. רונית: אינרציה","שתיהן באינרציה, כי המוצר זול והמעורבות נמוכה","הילה: קבלת החלטה מורכבת. רונית: נאמנות","הילה: אינרציה. רונית: נאמנות","הילה: נאמנות. רונית: קבלת החלטות מוגבלת"],c:0,e:"שתיהן במעורבות נמוכה. הילה מקבלת ערך מהגיוון ומחליטה מחדש בכל קנייה: קבלת החלטות מוגבלת, חיפוש מגוון. רונית חוזרת מתוך הרגל, כי אינה רואה הבדל ואין לה ערך בגיוון: אינרציה. בסיכום, אבקות הכביסה מופיעות כדוגמה לשני הדפוסים."},
{l:5,t:"דפוסי קנייה (מודל עשהאל)",s:"יישום",q:"דני נאמן שנים לקוסמטיקאית אחת. אחרי כמה טיפולים מאכזבים הוא מתחיל לבדוק לעומק קוסמטיקאיות אחרות. מה קרה, במונחי מודל עשהאל?",o:["הוא עבר מנאמנות לאינרציה","הוא עבר מחיפוש מגוון לנאמנות","הוא עבר מנאמנות לקבלת החלטה מורכבת","הוא עבר מאינרציה לחיפוש מגוון","הוא נשאר בנאמנות, כי מעורבותו גבוהה"],c:2,e:"נאמנות נמשכת בתנאי שהצרכנים ממשיכים לחוות שביעות רצון גבוהה. כששביעות הרצון נפגעת והמעורבות עדיין גבוהה, הצרכן חוזר לבחון מחדש את החלופות, בתהליך מעמיק: קבלת החלטה מורכבת."},
{l:5,t:"דפוסי קנייה (מודל עשהאל)",s:"סיכום",q:"למה צרכנים חוזרים על הקנייה בדפוס האינרציה, לפי הסיכום?",o:["בגלל בידול נמוך, כשאין ערך בגיוון","בגלל קשר אישי משמעותי עם נותן השירות","בגלל ערך שהם מקבלים מעצם הגיוון","בגלל תהליך מעמיק של הערכת חלופות","בגלל סיכון ואי ודאות גבוהים שכרוכים בכל החלטה חדשה"],c:0,e:"באינרציה החזרה נובעת מבידול מוצרי נמוך או מקושי להבין את ההבדלים בין החלופות. החלטה מחודשת אינה כרוכה בסיכון ממשי, אבל גם אין ערך בגיוון, וכל עוד התקבלה התוצאה הרצויה חוזרים על הקנייה באופן אוטומטי."},
]);

var READY=[];

(function(){
"use strict";
var LET=["1","2","3","4","5"];
/* מקורות השאלות — צבע התווית ליד כל שאלה */
var SRC_META={
  "מרצה":{bg:"var(--okBg)",fg:"var(--okTx)",full:"שאלת תרגול מהמרצה"},
  "יישום":{bg:"var(--warnBg)",fg:"var(--warnTx)",full:"שאלת יישום"},
  "סיכום":{bg:"var(--clsBg)",fg:"var(--clsTx)",full:"מהסיכומים"}
};
/* שמות היחידות. BG = יחידות רקע, שאינן ברשימת הנושאים לבחינה: כבויות כברירת מחדל */
var LNAME={1:"הצרכן החדש (רקע)",2:"הכרה בצורך וערכים",3:"תפיסה",4:"זיכרון",5:"מעורבות"};
var BG={1:1};
var app=document.getElementById("app");
var LECT=[],TOPICS=[],SOURCES=[];
(function(){var a={},b={},c={};BANK.forEach(function(q){
  if(!a[q.l]){a[q.l]=1;LECT.push(q.l);}
  if(!b[q.t]){b[q.t]=1;TOPICS.push(q.t);}
  if(!c[q.s]){c[q.s]=1;SOURCES.push(q.s);}
});LECT.sort(function(x,y){return x-y;});})();

var EXAM_L=LECT.filter(function(l){return !BG[l];});
var sel={lects:EXAM_L.slice(),topics:TOPICS.slice(),src:"all",mode:"practice",shuffle:true,minutes:0,count:14,pcount:20,balanced:true};
var quiz=[],idx=0,ansMap=[],timer=null,timeLeft=0;   /* ansMap[i] = התשובה שנבחרה לשאלה i */
var ctx="",elapsed=0;   /* ctx="ready" במבחן המוכנות */
var READY_Q=(typeof READY!=="undefined"&&READY)||[];

function E(tag,attr,html){var e=document.createElement(tag);if(attr)for(var k in attr)e.setAttribute(k,attr[k]);if(html!=null)e.innerHTML=html;return e;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* sel.src: "all", שם של מקור, או "fx" = כל השאלות במבנה המבחן (חמש תשובות), של המרצה ושנכתבו במבנה שלה */
var FXN=BANK.filter(function(q){return q.fx;}).length;
function srcOK(q){return sel.src==="all"||(sel.src==="fx"?!!q.fx:q.s===sel.src);}
function filterBank(){return BANK.filter(function(x){return sel.lects.indexOf(x.l)>=0 && sel.topics.indexOf(x.t)>=0 && srcOK(x);});}
function countBy(key,val){return BANK.filter(function(b){return b[key]===val;}).length;}
function fmt(s){var m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x;}
function srcBg(s){return (SRC_META[s]||{}).bg||"var(--surface2)";}
function srcFg(s){return (SRC_META[s]||{}).fg||"var(--muted)";}
/* בהסברים ⟦מילה⟧ מסמן את המילה שמכריעה בין התשובות */
function rich(s){return String(s).replace(/⟦([^⟧]*)⟧/g,'<mark class="key">$1</mark>');}

(function(){
  var parts=SOURCES.map(function(s){return (SRC_META[s]||{full:s}).full+" ("+countBy("s",s)+")";}).join(" · ");
  document.getElementById("sub").textContent=
    BANK.length+" שאלות מ-"+LECT.length+" יחידות — "+parts+
    ". המבחן: 14 שאלות אמריקאיות, חמש תשובות לשאלה, ומותר חומר עזר מודפס.";
})();

/* מערבב את סדר התשובות בכל שאלה, כדי שהתשובה הנכונה לא תהיה תמיד באותו מקום.
   שאלות במבנה המבחן (fx) נשארות בסדר קבוע, כי «תשובות א' וג' נכונות» מפנה לאותיות. */
function prepQ(q){
  var order=q.o.map(function(_,i){return i;});
  if(!q.fx)shuffle(order);
  var opts=order.map(function(i){return q.o[i];});
  return {l:q.l,t:q.t,s:q.s,q:q.q,o:opts,c:order.indexOf(q.c),e:q.e,fx:q.fx};
}
function buildQuiz(){
  var arr=filterBank().map(prepQ);
  if(sel.shuffle)shuffle(arr);
  return arr;
}

/* ---------- theme ---------- */
function initTheme(){
  var t=null;try{t=localStorage.getItem("amq_theme");}catch(e){}
  if(t)document.documentElement.className=t;
}
function toggleTheme(){
  var cur=document.documentElement.className;
  var isDark = cur==="dark" || (cur!=="light" && window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches);
  var nx=isDark?"light":"dark";
  document.documentElement.className=nx;
  try{localStorage.setItem("amq_theme",nx);}catch(e){}
}
initTheme();

/* ---------- setup screen ---------- */
function chipRow(label,items,isOn,onToggle,onAll,allOn){
  var row=E("div",{"class":"toolbar"});

  if(onAll){
    var ball=E("button",{"class":"chip"+(allOn?" active":"")},"הכל");
    ball.onclick=onAll; row.appendChild(ball);
  }
  items.forEach(function(it){
    var b=E("button",{"class":"chip"+(isOn(it.v)?" active":"")},it.label+(it.n!=null?" <small>"+it.n+"</small>":""));
    b.onclick=function(){onToggle(it.v);};
    row.appendChild(b);
  });
  return row;
}

/* ---------- מבחן מוכנות ---------- */
/* שאלות שלא נמצאות בבנק: מי שמתרגל שוב ושוב זוכר את השאלות, וציון הסימולציה עולה גם בלי שליטה בחומר.
   כאן אין משוב עד ההגשה, ואין תוויות של שיעור ונושא, כמו במבחן. התוצאה האחרונה נשמרת בדפדפן. */
var RKEY="amq_ready";
function readyLast(){try{return JSON.parse(localStorage.getItem(RKEY)||"null");}catch(e){return null;}}
function readySave(sc,total){
  try{localStorage.setItem(RKEY,JSON.stringify({sc:sc,total:total,sec:elapsed,d:new Date().toLocaleDateString("he-IL")}));}catch(e){}
}
function readyCard(){
  var ls=READY_Q.map(function(q){return q.l;});
  var lo=Math.min.apply(null,ls),hi=Math.max.apply(null,ls);
  var rc=E("div",{"class":"card"});
  rc.appendChild(E("div",{"class":"ctitle"},"🎯 מבחן מוכנות"));
  rc.appendChild(E("div",{"class":"scopehint",style:"margin:0 0 12px"},
    READY_Q.length+" שאלות חדשות משיעורים "+lo+"–"+hi+", שאינן מופיעות בתרגול ובהדפסה. "+
    "בתנאי מבחן: בלי משוב עד ההגשה, ובלי תוויות של שיעור ונושא. בסוף מקבלים ציון ופילוח לפי שיעור. "+
    "כדאי לעשות אותו פעם אחת, אחרי שמסיימים לתרגל, ובלי להציץ בחומר."));
  var last=readyLast();
  if(last&&last.total)rc.appendChild(E("div",{"class":"stats"},"<span>ניסיון קודם: <b>"+
    Math.round(last.sc/last.total*100)+"</b> ("+last.sc+" מתוך "+last.total+") · "+last.d+
    (last.sec?" · "+Math.max(1,Math.round(last.sec/60))+" דקות":"")+"</span>"));
  var rb=E("button",{"class":"btn btn-pri"},last?"מבחן מוכנות — ניסיון נוסף":"התחלת מבחן מוכנות");
  rb.style.width="100%";
  rb.onclick=readyStart;
  rc.appendChild(rb);
  return rc;
}
function readyStart(){
  ctx="ready";
  quiz=shuffle(READY_Q.map(prepQ));
  idx=0;ansMap=new Array(quiz.length);
  elapsed=0;stopTimer();
  timer=setInterval(function(){elapsed++;var el=document.getElementById("clock");if(el)el.textContent=fmt(elapsed);},1000);
  eRender();
}

/* ---------- גיליון הדפסה ---------- */
function printSheet(withAnswers){
  var arr=filterBank();
  if(!arr.length){alert("לא נבחרו שאלות להדפסה.");return;}
  var box=document.getElementById("print");
  box.className = withAnswers ? "" : "cols";
  var esc=function(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;};
  var h='<div class="prhead"><h2>בוחן תרגול — התנהגות צרכנים</h2><div>'+
        arr.length+" שאלות · "+(withAnswers?"עם תשובות והסברים":"ללא תשובות")+"</div></div>";
  arr.forEach(function(q,i){
    h+='<div class="pq"><div class="pt">יחידה '+q.l+' · '+esc(q.t)+'</div>'+
       '<div><span class="pn">'+(i+1)+'.</span> '+esc(q.q)+'</div>';
    q.o.forEach(function(o,k){ h+='<div class="po">'+LET[k]+". "+esc(o)+"</div>"; });
    if(withAnswers)
      h+='<div class="po pa">✔ '+LET[q.c]+". "+esc(q.o[q.c])+'</div>'+
         '<div class="po pe">'+esc(q.e).replace(/⟦([^⟧]*)⟧/g,"<b>$1</b>")+"</div>";
    h+="</div>";
  });
  box.innerHTML=h;
  window.print();
}

/* ---------- shared bits ---------- */
function bar(frac){
  var b=E("div",{"class":"bar"});
  b.innerHTML='<i style="width:'+(frac*100)+'%"></i>';
  return b;
}
function metaRow(q){
  var r=E("div",{"class":"qmeta"});
  r.innerHTML='<span class="pill">יחידה '+q.l+' · '+(LNAME[q.l]||"")+'</span><span class="pill">'+q.t+'</span>'+
    '<span class="pill" style="background:'+srcBg(q.s)+';color:'+srcFg(q.s)+'">'+((SRC_META[q.s]||{}).full||q.s)+'</span>';
  return r;
}
function topBar(extraHtml){
  var t=E("div",{"class":"toolbar"});
  var back=E("button",{"class":"iconbtn"},"→ חזרה להגדרות");
  back.onclick=function(){if(!timer||confirm("לצאת מהמבחן? התשובות לא יישמרו."))setup();};
  t.appendChild(back);
  t.appendChild(E("span",{"class":"spacer"}));
  if(extraHtml)t.appendChild(E("span",{},extraHtml));
  var th=E("button",{"class":"iconbtn"},"◐");
  th.onclick=toggleTheme;t.appendChild(th);
  return t;
}

/* דגימה שווה בין השיעורים: המבחן האמיתי שואל שאלה-שתיים מכל שיעור. לוקחים לסירוגין מכל שיעור בתורו,
   וסדר השיעורים אקראי: כשיש יותר מעשרה שיעורים, השאלה השנייה לא נופלת תמיד על אותם שיעורים. */
function balancedPick(arr,n){
  var by={},order=[];
  arr.forEach(function(q){ if(!by[q.l]){by[q.l]=[];order.push(q.l);} by[q.l].push(q); });
  shuffle(order);
  var out=[],i=0;
  while(out.length<n){
    var added=false;
    for(var k=0;k<order.length&&out.length<n;k++){
      var pool=by[order[k]];
      if(i<pool.length){ out.push(pool[i]); added=true; }
    }
    if(!added)break;
    i++;
  }
  return out;
}

/* ---------- practice mode ---------- */
/* אפשר לשוטט בין השאלות: הקודמת, הבאה ומפת שאלות. תשובה שנבחרה נשמרת, וכשחוזרים לשאלה
   רואים שוב את הסימון ואת ההסבר. */
function practiceStart(){
  ctx="";
  quiz=buildQuiz();
  if(sel.pcount&&quiz.length>sel.pcount)
    quiz=shuffle(balancedPick(quiz,sel.pcount));
  pBegin();
}
function pBegin(){idx=0;ansMap=new Array(quiz.length);pRender();}
function pTally(){
  var ok=0,bad=[],n=0;
  quiz.forEach(function(q,i){ if(ansMap[i]==null)return; n++; if(ansMap[i]===q.c)ok++; else bad.push(q); });
  return {ok:ok,bad:bad,n:n};
}
function pRender(keepScroll){
  var q=quiz[idx],a=ansMap[idx],done=a!=null,T=pTally(),last=idx===quiz.length-1;
  app.innerHTML="";
  var c=E("div",{"class":"card"});
  c.appendChild(topBar());
  var st=E("div",{"class":"stats"});
  st.innerHTML="<span>שאלה <b>"+(idx+1)+"</b> / <b>"+quiz.length+"</b></span>"+
    "<span>נכונות: <b>"+T.ok+"</b></span>"+
    "<span>שגויות: <b>"+T.bad.length+"</b></span>"+
    "<span class='spacer'></span><span>הצלחה: <b>"+(T.n?Math.round(T.ok/T.n*100)+"%":"—")+"</b></span>";
  c.appendChild(st);
  c.appendChild(bar(T.n/quiz.length));
  c.appendChild(metaRow(q));
  c.appendChild(E("div",{"class":"qtext"},q.q));

  var box=E("div");
  q.o.forEach(function(txt,i){
    var cls="opt";
    if(done)cls+=" locked"+(i===q.c?" correct":i===a?" wrong":"");
    var b=E("button",{"class":cls});
    b.innerHTML='<span class="ltr">'+LET[i]+'</span><span>'+txt+'</span>';
    b.onclick=function(){ if(ansMap[idx]!=null)return; ansMap[idx]=i; pRender(true); };
    box.appendChild(b);
  });
  c.appendChild(box);
  if(done){
    var ex=E("div",{"class":"expl"});
    ex.innerHTML='<span class="tag">'+(a===q.c?"נכון · ":"התשובה הנכונה: "+LET[q.c]+" · ")+'</span>'+rich(q.e);
    c.appendChild(ex);
  }

  var nav=E("div",{"class":"nav"});
  var prev=E("button",{"class":"btn"},"→ הקודמת");
  prev.disabled=idx===0;
  prev.onclick=function(){idx--;pRender();};
  var next=E("button",{"class":"btn"+(done?" btn-pri":"")},last?"סיום וצפייה בציון":done?"השאלה הבאה ←":"דילוג ←");
  next.onclick=function(){ if(last)pResults(); else{idx++;pRender();} };
  nav.appendChild(prev);nav.appendChild(next);
  c.appendChild(nav);

  c.appendChild(E("div",{"class":"ptitle",style:"margin-top:16px"},
    "מפת שאלות — לחצו כדי לעבור לשאלה · ירוק: נכונה · אדום: שגויה"));
  var pal=E("div",{"class":"palette"});
  quiz.forEach(function(qq,i){
    var m=ansMap[i]==null?"":ansMap[i]===qq.c?" ok":" bad";
    var b=E("button",{"class":"pbtn"+m+(i===idx?" cur":"")},String(i+1));
    b.onclick=function(){idx=i;pRender();};
    pal.appendChild(b);
  });
  c.appendChild(pal);
  if(!last){
    var fin=E("button",{"class":"btn"},"סיום הסבב וצפייה בציון");
    fin.style.width="100%";fin.style.marginTop="14px";
    fin.onclick=function(){
      var un=quiz.length-T.n;
      if(un>0&&!confirm("נותרו "+un+" שאלות שלא נענו. לסיים את הסבב?"))return;
      pResults();
    };
    c.appendChild(fin);
  }
  app.appendChild(c);
  if(!keepScroll)window.scrollTo(0,0);
}
function pResults(){
  var T=pTally();
  results(T.ok,quiz.length,T.bad,practiceStart,function(){
    quiz=T.bad.slice();if(sel.shuffle)shuffle(quiz);
    pBegin();
  },null);
}

/* מקלדת, במסך של שאלה: חץ שמאלה = הבאה, חץ ימינה = הקודמת (האתר מימין לשמאל), 1-5 = בחירת תשובה */
document.addEventListener("keydown",function(ev){
  if(!app.querySelector(".qtext")||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  var bs=app.querySelectorAll(".nav .btn");
  if(ev.key==="ArrowLeft"&&bs[1]&&!bs[1].disabled){ev.preventDefault();bs[1].click();}
  else if(ev.key==="ArrowRight"&&bs[0]&&!bs[0].disabled){ev.preventDefault();bs[0].click();}
  else if(/^[1-5]$/.test(ev.key)){
    var o=app.querySelectorAll(".opt")[+ev.key-1];
    if(o&&o.className.indexOf("locked")<0){ev.preventDefault();o.click();}
  }
});

/* ---------- exam mode ---------- */
function examStart(){
  ctx="";
  quiz=buildQuiz();
  if(sel.count&&quiz.length>sel.count)
    quiz=sel.balanced?shuffle(balancedPick(quiz,sel.count)):quiz.slice(0,sel.count);
  idx=0;ansMap=new Array(quiz.length);
  timeLeft=sel.minutes*60;
  if(sel.minutes)startTimer();
  eRender();
}
function startTimer(){
  stopTimer();
  timer=setInterval(function(){
    timeLeft--;
    var el=document.getElementById("clock");
    if(el)el.textContent=fmt(timeLeft);
    if(timeLeft<=0){stopTimer();examSubmit(true);}
  },1000);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function eRender(){
  var q=quiz[idx];
  app.innerHTML="";
  var c=E("div",{"class":"card"});
  c.appendChild(topBar(ctx==="ready"?'מבחן מוכנות · זמן: <span class="clock" id="clock">'+fmt(elapsed)+'</span>':
    sel.minutes?'זמן שנותר: <span class="clock" id="clock">'+fmt(timeLeft)+'</span>':""));
  var nAns=0;for(var i=0;i<ansMap.length;i++)if(ansMap[i]!=null)nAns++;
  var st=E("div",{"class":"stats"});
  st.innerHTML="<span>שאלה <b>"+(idx+1)+"</b> / <b>"+quiz.length+"</b></span><span>נענו: <b>"+nAns+"</b></span>";
  c.appendChild(st);
  c.appendChild(bar(nAns/quiz.length));
  if(ctx!=="ready")c.appendChild(metaRow(q));
  c.appendChild(E("div",{"class":"qtext"},q.q));

  var box=E("div");
  q.o.forEach(function(txt,i){
    var b=E("button",{"class":"opt"+(ansMap[idx]===i?" picked":"")});
    b.innerHTML='<span class="ltr">'+LET[i]+'</span><span>'+txt+'</span>';
    b.onclick=function(){ansMap[idx]=i;eRender();};
    box.appendChild(b);
  });
  c.appendChild(box);

  var nav=E("div",{"class":"nav"});
  var prev=E("button",{"class":"btn"},"→ הקודמת");
  prev.disabled=idx===0;prev.onclick=function(){idx--;eRender();};
  var next=E("button",{"class":"btn btn-pri"},"הבאה ←");
  next.disabled=idx===quiz.length-1;next.onclick=function(){idx++;eRender();};
  nav.appendChild(prev);nav.appendChild(next);
  c.appendChild(nav);

  c.appendChild(E("div",{"class":"ptitle",style:"margin-top:16px"},"מפת שאלות — לחצו כדי לעבור לשאלה · מסומנות: שאלות שנענו"));
  var pal=E("div",{"class":"palette"});
  quiz.forEach(function(_,i){
    var b=E("button",{"class":"pbtn"+(ansMap[i]!=null?" ans":"")+(i===idx?" cur":"")},String(i+1));
    b.onclick=function(){idx=i;eRender();};
    pal.appendChild(b);
  });
  c.appendChild(pal);

  var sub=E("button",{"class":"btn btn-pri"},"הגשת המבחן");
  sub.style.width="100%";sub.style.marginTop="14px";
  sub.onclick=function(){
    var un=quiz.length-nAns;
    if(un>0&&!confirm("נותרו "+un+" שאלות ללא מענה. להגיש בכל זאת?"))return;
    examSubmit(false);
  };
  c.appendChild(sub);
  app.appendChild(c);
  window.scrollTo(0,0);
}
function examSubmit(auto){
  stopTimer();
  var sc=0,wr=[];
  quiz.forEach(function(q,i){ if(ansMap[i]===q.c)sc++; else wr.push({q:q,given:ansMap[i]}); });
  if(ctx==="ready")readySave(sc,quiz.length);
  results(sc,quiz.length,wr.map(function(x){return x.q;}),ctx==="ready"?readyStart:examStart,null,wr,auto);
}

/* ---------- results ---------- */
function results(sc,total,wr,onAgain,onRetryWrong,detail,auto){
  stopTimer();
  app.innerHTML="";
  var pct=total?Math.round(sc/total*100):0;
  var c=E("div",{"class":"card result"});
  if(auto)c.appendChild(E("div",{"class":"note"},"<b>הזמן נגמר</b> — המבחן הוגש אוטומטית."));
  if(ctx==="ready")c.appendChild(E("div",{"class":"note"},"<b>מבחן מוכנות</b> · "+Math.max(1,Math.round(elapsed/60))+
    " דקות · השאלות האלה לא מופיעות בתרגול, ולכן הציון מעריך שליטה בחומר."));
  c.appendChild(E("div",{"class":"big"},pct));
  var g = pct>=90?"מצוין — שליטה מלאה בחומר":
          pct>=80?"טוב מאוד":
          pct>=70?"טוב — כדאי לחזור על הנושאים החלשים":
          pct>=60?"עובר — מומלץ לחזור ולתרגל":
                  "מתחת לציון עובר — כדאי לחזור על החומר ולתרגל שוב";
  c.appendChild(E("div",{"class":"grade"},sc+" מתוך "+total+" · "+g));

  var nav=E("div",{"class":"nav"});
  var again=E("button",{"class":"btn btn-pri"},"סבב חדש");
  again.onclick=onAgain;nav.appendChild(again);
  if(onRetryWrong&&wr.length){
    var rw=E("button",{"class":"btn"},"תרגול "+wr.length+" השגויות");
    rw.onclick=onRetryWrong;nav.appendChild(rw);
  }
  var home=E("button",{"class":"btn"},"הגדרות");
  home.onclick=setup;nav.appendChild(home);
  c.appendChild(nav);
  app.appendChild(c);

  if(detail)app.appendChild(breakdown(quiz,wr));
  if(detail&&detail.length){
    var d=E("div",{"class":"card"});
    d.appendChild(E("div",{"class":"ptitle"},"סקירת "+detail.length+" השאלות שנענו לא נכון"));
    detail.forEach(function(x){
      var r=E("div",{"class":"rev"});
      var given = x.given==null?"<i>לא נענתה</i>":LET[x.given]+". "+x.q.o[x.given];
      r.innerHTML='<div style="font-size:11.5px;color:var(--muted)">יחידה '+x.q.l+' · '+x.q.t+'</div>'+
        '<div class="rq">'+x.q.q+'</div>'+
        '<div class="ra">התשובה שלך: '+given+'</div>'+
        '<div class="rc">התשובה הנכונה: '+LET[x.q.c]+". "+x.q.o[x.q.c]+'</div>'+
        '<div style="margin-top:6px;color:var(--muted)">'+rich(x.q.e)+'</div>';
      d.appendChild(r);
    });
    app.appendChild(d);
  } else if(wr.length){
    var d2=E("div",{"class":"card"});
    d2.appendChild(E("div",{"class":"ptitle"},"נושאים לחזרה"));
    var byTopic={},order=[];
    wr.forEach(function(q){var k="יחידה "+q.l+" · "+q.t;if(!byTopic[k]){byTopic[k]=0;order.push(k);}byTopic[k]++;});
    var ul=E("div",{"class":"toolbar"});
    order.forEach(function(t){
      ul.appendChild(E("span",{"class":"pill"},t+" — "+byTopic[t]+(byTopic[t]===1?" שגיאה":" שגיאות")));
    });
    d2.appendChild(ul);
    app.appendChild(d2);
  }
  window.scrollTo(0,0);
}

/* פילוח לפי שיעור בסוף מבחן: כמה נענו נכון מכל שיעור, ועל מה לחזור קודם */
function breakdown(all,wrongQs){
  var by={},order=[],bad={};
  all.forEach(function(q){if(!by[q.l]){by[q.l]=0;order.push(q.l);}by[q.l]++;});
  wrongQs.forEach(function(q){bad[q.l]=(bad[q.l]||0)+1;});
  order.sort(function(a,b){return a-b;});
  var d=E("div",{"class":"card"});
  d.appendChild(E("div",{"class":"ptitle"},"פילוח לפי יחידה"));
  var weak=[];
  order.forEach(function(l){
    var n=by[l],ok=n-(bad[l]||0),f=ok/n;
    if(f<0.75)weak.push({l:l,f:f});
    var row=E("div",{"class":"brk"+(f<0.5?" low":f<1?" mid":"")});
    row.innerHTML='<span class="bl">יחידה '+l+' · '+(LNAME[l]||"")+'</span>'+
      '<span class="bb"><i style="width:'+Math.round(f*100)+'%"></i></span><span class="bv">'+ok+'/'+n+'</span>';
    d.appendChild(row);
  });
  if(weak.length){
    weak.sort(function(a,b){return a.f-b.f||a.l-b.l;});
    var ls=weak.map(function(w){return w.l;});
    d.appendChild(E("div",{"class":"scopehint",style:"margin:12px 0 10px"},
      "כדאי לחזור קודם על: "+ls.map(function(l){return "יחידה "+l+" ("+(LNAME[l]||"")+")";}).join(", ")+"."));
    var go=E("button",{"class":"btn"},"תרגול היחידות האלה");
    go.onclick=function(){sel.lects=ls.slice();sel.topics=TOPICS.slice();sel.src="all";sel.mode="practice";ctx="";setup();};
    d.appendChild(go);
  } else d.appendChild(E("div",{"class":"scopehint",style:"margin-top:12px"},"בלי שגיאות. כל היחידות עברו."));
  return d;
}

setup();
})();
